<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>マイページ（教師）</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      color: #111;
    }

    /* 上部メニュー（管理者ページと合わせる） */
    header {
      border-bottom: 1px solid #ccc;
      padding: 16px 40px;
      display: flex;
      justify-content: center;
      gap: 80px;
      font-size: 14px;
      background-color: #fff;
    }
    header a {
      text-decoration: none;
      color: #333;
      cursor: pointer;
    }

    .container {
      width: 700px;
      margin: 50px auto 80px;
      background: #fff;
      border: 4px solid #000;
      padding: 50px 70px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin: 0 0 40px;
      letter-spacing: 0.2em;
      font-size: 26px;
    }

    .section {
      border-top: 2px solid #000;
      padding-top: 24px;
      margin-top: 24px;
    }
    .section:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 16px;
      letter-spacing: 0.08em;
    }

    .grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px 16px;
      align-items: center;
    }

    .label {
      font-size: 13px;
      color: #111;
    }

    .value {
      font-size: 14px;
      padding: 10px;
      border: 2px solid #000;
      background: #fdfdfd;
      box-sizing: border-box;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 2px solid #000;
      font-size: 14px;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 10px 16px;
      border: 2px solid #000;
      background: #ddd;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    .btn.secondary {
      background: #fff;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    .error {
      color: #d00;
      font-size: 13px;
      margin-top: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      color: #0a7a2f;
      font-size: 13px;
      margin-top: 10px;
      display: none;
      white-space: pre-wrap;
    }

    /* 未ログイン案内 */
    .need-login-box {
      border: 2px solid #000;
      background: #fff;
      padding: 16px;
      margin: 0 0 20px;
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }
    .modal {
      width: 520px;
      background: #fff;
      border: 4px solid #000;
      padding: 26px 28px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
<header>
  <a href="adminevents.html">説明会情報管理</a>
  <a href="admincompanies.html">会社情報管理</a>
  <a href="#" id="logoutLink">ログアウト</a>
  <a href="teacher_mypage.html">アカウント</a>
</header>

<div class="container">
  <h1>マイページ（教師）</h1>

  <!-- 未ログイン表示 -->
  <div id="needLoginBox" class="need-login-box" style="display:none;">
    <b>ログインが必要です</b><br>
    <a href="login.html">ログイン画面へ</a>
  </div>

  <div id="authedArea" style="display:none;">
    <div class="section">
      <div class="section-title">基本情報</div>
      <div class="grid">
        <div class="label">氏名</div>
        <div class="value" id="vName">-</div>

        <div class="label">メール</div>
        <div class="value" id="vEmail">-</div>

        <div class="label">担当学年</div>
        <div class="value" id="vGrade">-</div>

        <div class="label">担当クラス</div>
        <div class="value" id="vClass">-</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8080";
  const ME_API = "/api/teacher/me";

  function getLoginInfo() {
    return {
      token: localStorage.getItem("token"),
      role: (localStorage.getItem("role") || "").toLowerCase()
    };
  }

  function setupHeaderByLoginStatus() {
    const logoutLink = document.getElementById("logoutLink");
    const { token } = getLoginInfo();

    if (!token) {
      logoutLink.textContent = "ログイン";
      logoutLink.href = "login.html";
      return;
    }

    logoutLink.textContent = "ログアウト";
    logoutLink.href = "#";

    logoutLink.replaceWith(logoutLink.cloneNode(true));
    const newLink = document.getElementById("logoutLink");

    newLink.addEventListener("click", (e) => {
      e.preventDefault();

      localStorage.removeItem("token");
      localStorage.removeItem("userId");
      localStorage.removeItem("email");
      localStorage.removeItem("name");
      localStorage.removeItem("role");

      alert("ログアウトしました。");
      window.location.href = "index.html"; // ★ここ
    });
  }

  function renderAuthState() {
    const { token } = getLoginInfo();
    document.getElementById("needLoginBox").style.display = token ? "none" : "block";
    document.getElementById("authedArea").style.display = token ? "block" : "none";
    return !!token;
  }

  async function loadMe() {
    const { token } = getLoginInfo();
    if (!token) return;

    const res = await fetch(API_BASE + ME_API, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      localStorage.removeItem("token");
      renderAuthState();
      return;
    }

    const me = await res.json();
    document.getElementById("vName").textContent = me.name || "-";
    document.getElementById("vEmail").textContent = me.email || "-";
    document.getElementById("vGrade").textContent = me.grade ? me.grade + "年" : "-";
    document.getElementById("vClass").textContent = me.myClass || "-";
  }

  window.addEventListener("load", async () => {
    setupHeaderByLoginStatus();
    if (!renderAuthState()) return;

    const { role } = getLoginInfo();
    if (role !== "normal_admin") {
      alert("教師専用ページです");
      window.location.href = "index.html";
      return;
    }

    await loadMe();
  });
</script>

</body>
</html>
