<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>会社情報管理（管理者）</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#fafafa; color:#111; }

    header{
      border-bottom:1px solid #ccc;
      padding:16px 40px;
      display:flex;
      justify-content:center;
      gap:80px;
      font-size:14px;
      background:#fff;
    }
    header a{ text-decoration:none; color:#333; cursor:pointer; }

    main{ max-width:900px; margin:30px auto 60px; padding:0 16px; }

    .search-box{
      margin: 0 auto 20px;
      max-width: 760px;
      border: 1px solid #333;
      padding: 16px;
      background-color: #fff;
    }
    .search-grid{
      display:grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap:10px;
      align-items:center;
    }
    .search-grid input{
      width:100%;
      padding: 8px 10px;
      box-sizing: border-box;
      border:1px solid #ccc;
    }
    .search-grid button{
      padding: 8px 12px;
      cursor: pointer;
      border:1px solid #333;
      background:#fff;
      font-size: 13px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:12px;
      margin: 12px 0 10px;
    }
    .btn{
      padding:10px 14px;
      border:1px solid #333;
      background:#fff;
      cursor:pointer;
      font-size: 13px;
    }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .danger { border-color:#c00; }

    .hint{
      font-size:12px;
      color:#333;
      margin: 6px 0 14px;
    }

    #companyList{ margin-top: 10px; }

    .company-card{
      border:1px solid #333;
      background:#fff;
      margin-bottom:12px;
    }

    .company-header{
      padding:10px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor: default;
    }
    .company-title{
      font-weight:bold;
      font-size: 16px;
      line-height: 1.4;
    }
    .toggle-btn{
      padding:4px 8px;
      cursor:pointer;
      font-size:12px;
      border:1px solid #333;
      background:#fff;
    }

    .company-detail{
      border-top:1px solid #333;
      padding:10px 16px 14px;
      display:none;
      font-size:14px;
    }

    .kv{
      display:grid;
      grid-template-columns: 90px 1fr;
      row-gap:10px;
      column-gap:14px;
      margin-top: 6px;
    }
    .kv .k{ font-weight:bold; }
    .kv .v{ word-break: break-word; }

    .admin-actions{
      margin-top: 14px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }

    #pagination{
      text-align:center;
      margin-top:24px;
      font-size:14px;
    }
    .page-link{
      display:inline-block;
      margin:0 6px;
      cursor:pointer;
    }
    .page-link.active{
      font-weight:bold;
      text-decoration:underline;
    }

    .message{
      text-align:center;
      margin-top:20px;
      color:#666;
      white-space: pre-line;
    }

    /* modal */
    .backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; }
    .modal { width:520px; max-width: calc(100vw - 32px); background:#fff; margin: 90px auto; padding:16px; border-radius:8px; border:1px solid #333; }
    .modal h2 { margin:0 0 12px; font-size: 16px; }
    .field { margin: 10px 0; }
    .field label { display:block; font-size:12px; color:#222; margin-bottom:4px; }
    .field input { width:100%; padding:10px; border:1px solid #ccc; box-sizing:border-box; }
    .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
    .error { color:#c00; font-size:12px; margin-top:8px; }
  </style>
</head>
<body>

<header>
  <a href="adminevents.html">説明会情報管理</a>
  <a href="admincompanies.html">会社情報管理</a>

  <!-- ★ super_admin のときだけ表示 -->
  <a href="super_admin_user_manage.html" id="userManageLink" style="display:none;">ユーザー管理</a>
  <a href="teacherRegister.html" id="teacherRegisterLink" style="display:none;">新規教師登録</a>

  <a href="#" id="logoutLink">ログアウト</a>
  <a href="teacher_mypage.html" id="accountLink">アカウント</a>
</header>

<main>
  <div class="top-actions">
    <button class="btn" id="openModalBtn">会社新規登録ボタン</button>
  </div>

  <!-- ★検索（会社名・所在地） -->
  <div class="search-box">
    <div class="search-grid">
      <input id="qName" type="text" placeholder="会社名で検索">
      <input id="qAddress" type="text" placeholder="所在地で検索">
      <button id="searchBtn">検索</button>
      <button id="clearBtn">クリア</button>
    </div>
  </div>

  <div class="hint">＊ 登録・閲覧・編集・画面はポップアップBOXで表示</div>

  <div id="companyList"></div>
  <div id="message" class="message"></div>
  <div id="pagination"></div>
</main>

<!-- Modal（新規登録） -->
<div class="backdrop" id="backdrop">
  <div class="modal">
    <h2>会社新規登録</h2>

    <div class="field">
      <label>会社名（必須）</label>
      <input id="m_name" />
    </div>

    <div class="field">
      <label>所在地</label>
      <input id="m_address" />
    </div>

    <div class="field">
      <label>公式サイト</label>
      <input id="m_website" placeholder="https://..." />
    </div>

    <div class="actions">
      <button class="btn" id="closeModalBtn">キャンセル</button>
      <button class="btn" id="saveBtn">登録</button>
    </div>

    <div class="error" id="modalMsg"></div>
  </div>
</div>

<!-- Modal（編集） -->
<div class="backdrop" id="editBackdrop">
  <div class="modal">
    <h2>会社情報 編集</h2>

    <div class="field">
      <label>会社名（必須）</label>
      <input id="e_name" />
    </div>

    <div class="field">
      <label>所在地</label>
      <input id="e_address" />
    </div>

    <div class="field">
      <label>公式サイト</label>
      <input id="e_website" placeholder="https://..." />
    </div>

    <div class="actions">
      <button class="btn" id="editCancelBtn">キャンセル</button>
      <button class="btn" id="editSaveBtn">更新</button>
    </div>

    <div class="error" id="editMsg"></div>
  </div>
</div>

<!-- Modal（削除確認） -->
<div class="backdrop" id="deleteBackdrop">
  <div class="modal">
    <h2>削除確認</h2>
    <div id="deleteText" style="font-size:14px; line-height:1.6;"></div>

    <div class="actions">
      <button class="btn" id="deleteCancelBtn">キャンセル</button>
      <button class="btn danger" id="deleteOkBtn">削除する</button>
    </div>

    <div class="error" id="deleteMsg"></div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080"; //外部公開用

  const token = localStorage.getItem("token");
  const roleRaw = localStorage.getItem("role"); // "normal_admin" / "super_admin"
  const roleUpper = roleRaw ? roleRaw.toUpperCase() : "";

  // ★ normal_admin / super_admin を「管理者」として扱う
  const isAdmin = (roleUpper === "NORMAL_ADMIN" || roleUpper === "SUPER_ADMIN");
  const isSuperAdmin = (roleUpper === "SUPER_ADMIN");

  function setupSuperAdminHeaderLinks() {
    const userManageLink = document.getElementById("userManageLink");
    const teacherRegisterLink = document.getElementById("teacherRegisterLink");
    const accountLink = document.getElementById("accountLink");

    if (userManageLink) userManageLink.style.display = isSuperAdmin ? "inline" : "none";
    if (teacherRegisterLink) teacherRegisterLink.style.display = isSuperAdmin ? "inline" : "none";

    if (accountLink) {
      if (isSuperAdmin) {
        accountLink.href = "super_admin_mypage.html";
      } else {
        accountLink.href = "teacher_mypage.html";
        accountLink.textContent = "アカウント";
      }
    }
  }

  const listEl = document.getElementById("companyList");
  const msgEl = document.getElementById("message");
  const paginationEl = document.getElementById("pagination");

  // ★検索入力
  const qNameEl = document.getElementById("qName");
  const qAddressEl = document.getElementById("qAddress");
  const searchBtn = document.getElementById("searchBtn");
  const clearBtn = document.getElementById("clearBtn");

  // 新規登録
  const backdrop = document.getElementById("backdrop");
  const openModalBtn = document.getElementById("openModalBtn");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const saveBtn = document.getElementById("saveBtn");
  const modalMsg = document.getElementById("modalMsg");

  // 編集
  const editBackdrop = document.getElementById("editBackdrop");
  const eName = document.getElementById("e_name");
  const eAddress = document.getElementById("e_address");
  const eWebsite = document.getElementById("e_website");
  const editCancelBtn = document.getElementById("editCancelBtn");
  const editSaveBtn = document.getElementById("editSaveBtn");
  const editMsg = document.getElementById("editMsg");

  // 削除
  const deleteBackdrop = document.getElementById("deleteBackdrop");
  const deleteText = document.getElementById("deleteText");
  const deleteCancelBtn = document.getElementById("deleteCancelBtn");
  const deleteOkBtn = document.getElementById("deleteOkBtn");
  const deleteMsg = document.getElementById("deleteMsg");

  // 新規入力
  const mName = document.getElementById("m_name");
  const mAddress = document.getElementById("m_address");
  const mWebsite = document.getElementById("m_website");

  const PAGE_SIZE = 10;
  let currentPage = 1;
  let totalPages = 1;

  let editingCompanyId = null;
  let deletingCompanyId = null;

  if (!token) {
    msgEl.textContent = "JWTトークンがありません。先に管理者でログインしてください。";
  }
  if (!isAdmin) {
    openModalBtn.disabled = true;
    openModalBtn.title = "管理者のみ操作できます";
  }

  document.getElementById("logoutLink").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("email");
    localStorage.removeItem("name");
    localStorage.removeItem("role");
    alert("ログアウトしました。");
    window.location.href = "index.html";
  });

  // ===== modal open/close =====
  openModalBtn.onclick = () => {
    if (!isAdmin) return;
    modalMsg.textContent = "";
    mName.value = "";
    mAddress.value = "";
    mWebsite.value = "";
    backdrop.style.display = "block";
  };
  closeModalBtn.onclick = () => backdrop.style.display = "none";
  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop) backdrop.style.display = "none";
  });

  editCancelBtn.onclick = () => editBackdrop.style.display = "none";
  editBackdrop.addEventListener("click", (e) => {
    if (e.target === editBackdrop) editBackdrop.style.display = "none";
  });

  deleteCancelBtn.onclick = () => deleteBackdrop.style.display = "none";
  deleteBackdrop.addEventListener("click", (e) => {
    if (e.target === deleteBackdrop) deleteBackdrop.style.display = "none";
  });

  // ===== 検索 =====
  function doSearch() {
    loadCompanies(1);
  }
  searchBtn.onclick = doSearch;
  clearBtn.onclick = () => {
    qNameEl.value = "";
    qAddressEl.value = "";
    loadCompanies(1);
  };

  [qNameEl, qAddressEl].forEach(el => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });
  });

  // ===== data load =====
  async function loadCompanies(page) {
    if (page < 1) page = 1;

    const qName = qNameEl.value.trim();
    const qAddress = qAddressEl.value.trim();

    const qs = new URLSearchParams({
      page: String(page),
      size: String(PAGE_SIZE)
    });

    // ★検索条件があれば付ける（バックエンド：qName / qAddress）
    if (qName) qs.set("qName", qName);
    if (qAddress) qs.set("qAddress", qAddress);

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies?${qs.toString()}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (!res.ok) throw new Error("HTTP status " + res.status);

      const data = await res.json();
      const items = data.items ?? [];
      currentPage = data.page ?? page;
      totalPages = data.totalPages ?? 1;

      renderCompanies(items);
      renderPagination();
      renderMessage(data.totalItems ?? items.length, qName, qAddress);
    } catch (err) {
      console.error(err);
      listEl.innerHTML = "";
      paginationEl.innerHTML = "";
      msgEl.textContent = "会社情報の取得に失敗しました。サーバーを確認してください。";
    }
  }

  function renderCompanies(companies) {
    listEl.innerHTML = "";
    if (!companies || companies.length === 0) return;

    for (const c of companies) {
      const card = document.createElement("div");
      card.className = "company-card";

      const header = document.createElement("div");
      header.className = "company-header";

      const title = document.createElement("div");
      title.className = "company-title";
      title.textContent = c.name ?? "会社名未設定";

      const toggleBtn = document.createElement("button");
      toggleBtn.className = "toggle-btn";
      toggleBtn.textContent = "▽ 詳細表示";

      header.appendChild(title);
      header.appendChild(toggleBtn);

      const detail = document.createElement("div");
      detail.className = "company-detail";

      detail.innerHTML = `
        <div class="kv">
          <div class="k">所在地</div><div class="v">${escapeHtml(c.address ?? "未設定")}</div>
          <div class="k">公式サイト</div><div class="v">${escapeHtml(c.website ?? "未設定")}</div>
        </div>
      `;

      if (isAdmin) {
        const actions = document.createElement("div");
        actions.className = "admin-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "btn";
        editBtn.textContent = "編集";
        editBtn.addEventListener("click", () => openEditModal(c));

        const delBtn = document.createElement("button");
        delBtn.className = "btn danger";
        delBtn.textContent = "削除";
        delBtn.addEventListener("click", () => openDeleteModal(c));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        detail.appendChild(actions);
      }

      toggleBtn.addEventListener("click", () => {
        const isOpen = detail.style.display === "block";
        detail.style.display = isOpen ? "none" : "block";
        toggleBtn.textContent = isOpen ? "▽ 詳細表示" : "△ 閉じる";
      });

      card.appendChild(header);
      card.appendChild(detail);
      listEl.appendChild(card);
    }
  }

  function renderPagination() {
    paginationEl.innerHTML = "";
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
      const span = document.createElement("span");
      span.className = "page-link" + (i === currentPage ? " active" : "");
      span.textContent = String(i);
      span.addEventListener("click", () => loadCompanies(i));
      paginationEl.appendChild(span);
    }

    if (currentPage < totalPages) {
      const next = document.createElement("span");
      next.className = "page-link";
      next.textContent = ">>next";
      next.addEventListener("click", () => loadCompanies(currentPage + 1));
      paginationEl.appendChild(next);
    }
  }

  function renderMessage(totalItems, qName, qAddress) {
    if (!totalItems || totalItems === 0) {
      const lines = [];
      lines.push("該当する会社情報がありません。");
      if (qName || qAddress) {
        lines.push("");
        lines.push("【検索条件】");
        if (qName) lines.push("・会社名: " + qName);
        if (qAddress) lines.push("・所在地: " + qAddress);
      }
      msgEl.textContent = lines.join("\n");
    } else {
      msgEl.textContent = "";
    }
  }

  // ===== create =====
  saveBtn.onclick = async () => {
    if (!isAdmin) return;

    modalMsg.textContent = "";
    saveBtn.disabled = true;

    const payload = {
      name: mName.value.trim(),
      address: mAddress.value.trim(),
      website: mWebsite.value.trim()
    };

    if (!payload.name) {
      modalMsg.textContent = "会社名は必須です";
      saveBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let msg = "";
        try {
          const err = await res.json();
          msg = err.message ?? JSON.stringify(err);
        } catch {
          msg = await res.text();
        }
        modalMsg.textContent = `登録失敗: ${res.status} ${msg}`;
        saveBtn.disabled = false;
        return;
      }

      backdrop.style.display = "none";
      saveBtn.disabled = false;

      // ★登録後は検索条件を維持して1ページ目へ
      await loadCompanies(1);
    } catch (e) {
      console.error(e);
      modalMsg.textContent = "通信に失敗しました。サーバーを確認してください。";
      saveBtn.disabled = false;
    }
  };

  // ===== edit open/save =====
  function openEditModal(company) {
    if (!isAdmin) return;

    editMsg.textContent = "";
    editingCompanyId = company.companyId;

    eName.value = company.name ?? "";
    eAddress.value = company.address ?? "";
    eWebsite.value = company.website ?? "";

    editBackdrop.style.display = "block";
  }

  editSaveBtn.onclick = async () => {
    if (!isAdmin) return;

    editMsg.textContent = "";
    editSaveBtn.disabled = true;

    const payload = {
      name: eName.value.trim(),
      address: eAddress.value.trim(),
      website: eWebsite.value.trim()
    };

    if (!payload.name) {
      editMsg.textContent = "会社名は必須です";
      editSaveBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies/${editingCompanyId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let msg = "";
        try { msg = (await res.json()).message ?? ""; } catch { msg = await res.text(); }
        editMsg.textContent = `更新失敗: ${res.status} ${msg}`;
        editSaveBtn.disabled = false;
        return;
      }

      alert("更新しました。");
      editBackdrop.style.display = "none";
      editSaveBtn.disabled = false;

      await loadCompanies(currentPage);
    } catch (e) {
      console.error(e);
      editMsg.textContent = "通信に失敗しました。サーバーを確認してください。";
      editSaveBtn.disabled = false;
    }
  };

  // ===== delete open/ok =====
  function openDeleteModal(company) {
    if (!isAdmin) return;

    deleteMsg.textContent = "";
    deletingCompanyId = company.companyId;

    deleteText.innerHTML = `
      <div>この会社を削除します。よろしいですか？</div>
      <div style="margin-top:10px;">
        <div><b>会社名：</b>${escapeHtml(company.name ?? "")}</div>
        <div><b>所在地：</b>${escapeHtml(company.address ?? "")}</div>
        <div><b>公式サイト：</b>${escapeHtml(company.website ?? "")}</div>
      </div>
      <div style="margin-top:10px; color:#666; font-size:12px;">
        ※ 説明会に紐づいている会社は削除できません。
      </div>
    `;

    deleteBackdrop.style.display = "block";
  }

  deleteOkBtn.onclick = async () => {
    if (!isAdmin) return;

    deleteMsg.textContent = "";
    deleteOkBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies/${deletingCompanyId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!res.ok) {
        let msg = "";
        try { msg = (await res.json()).message ?? ""; } catch { msg = await res.text(); }
        deleteMsg.textContent = `削除失敗: ${res.status} ${msg}`;
        deleteOkBtn.disabled = false;
        return;
      }

      alert("削除しました。");
      deleteBackdrop.style.display = "none";
      deleteOkBtn.disabled = false;

      await loadCompanies(currentPage);
    } catch (e) {
      console.error(e);
      deleteMsg.textContent = "通信に失敗しました。サーバーを確認してください。";
      deleteOkBtn.disabled = false;
    }
  };

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  window.addEventListener("load", () => {
    setupSuperAdminHeaderLinks();
    loadCompanies(1);
  });
</script>

</body>
</html>
