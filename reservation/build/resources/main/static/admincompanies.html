<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>会社情報管理（管理者）</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow: 0 10px 30px rgba(16,24,40,.08);
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --radius:14px;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --danger-bg: rgba(180,35,24,.08);
      --focus: 0 0 0 4px rgba(37,99,235,.18);
      --container: 1120px;
      --content: 980px;
      --pad: 24px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      padding-bottom: 72px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(1200px 520px at 50% -180px, rgba(37,99,235,.10), rgba(37,99,235,0));
      background-repeat: no-repeat;
      background-attachment: fixed;
      line-height: 1.55;
    }

    /* ===== Header（index.html と同じ想定の統一スタイル） ===== */
   header{
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      /* “中央らへんでいい感じに分散”：
         1) nav自体は中央配置
         2) navの中身は等間隔に分散
         3) ただし巨大画面でも広がりすぎないよう max-width を持たせる */
      .header-inner{
        max-width: var(--container);
        margin: 0 auto;
        padding: 14px var(--pad);
        display:flex;
        justify-content:center;   /* navを中央に */
        align-items:center;
      }

      .nav{
        width: min(760px, 100%);  /* 広がりすぎ防止（中央らへん） */
        display:flex;
        align-items:center;
        justify-content: space-around; /* 中央付近で“分散” */
        gap: 10px;
        flex-wrap:wrap;
      }

      .nav a{
        text-decoration:none;
        color:#344054;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 999px;
        transition: background-color .15s ease, color .15s ease, transform .05s ease;
        outline: none;
        white-space: nowrap;
      }
    .nav a:hover{ background:#f2f4f7; color:#111827; }
    .nav a:active{ transform: translateY(1px); }
    .nav a:focus-visible{ box-shadow: var(--focus); }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight: 800;
      border-color: rgba(37,99,235,.20);
    }
    .nav a.danger-link{
      color:#b42318;
      border-color: rgba(180,35,24,.18);
      background: rgba(180,35,24,.06);
    }
    .nav a.danger-link:hover{
      background: rgba(180,35,24,.10);
      color:#8a1f16;
    }

    /* ===== Layout ===== */
    main{
      max-width: var(--content);
      margin: 24px auto 0;
      padding: 0 16px 90px;
    }

    .page-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      margin: 10px 0 12px;
    }
    .page-title h1{
      margin: 0;
      font-size: 18px;
      letter-spacing: .02em;
    }
    .page-title .hint{
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0 12px;
      flex-wrap: wrap;
    }

    /* ===== Cards ===== */
    .panel{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 14px;
    }

    .row{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
    }

    .input{
      height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      font-size: 14px;
      font-family: inherit;
    }
    .input:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .btn{
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
      transition: transform .05s ease, background-color .15s ease, border-color .15s ease;
      outline: none;
      white-space: nowrap;
    }
    .btn:hover{ background:#f9fafb; }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{ box-shadow: var(--focus); }
    .btn:disabled{ opacity: 0.6; cursor: not-allowed; }

    .btn-primary{
      background: var(--accent);
      border-color: rgba(37,99,235,.25);
      color: #fff;
      font-weight: 800;
    }
    .btn-primary:hover{ background: var(--accent-2); }

    .btn-danger{
      color:#b42318;
      border-color: rgba(180,35,24,.25);
      background: rgba(180,35,24,.06);
    }
    .btn-danger:hover{ background: rgba(180,35,24,.10); }

    .hint-text{
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 14px;
    }

    /* ===== Company list cards ===== */
    #companyList{ margin-top: 12px; }

    .company-card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .company-header{
      padding: 12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
    }

    .company-title{
      font-weight: 900;
      font-size: 15px;
      letter-spacing: .01em;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .tiny{
      font-size: 12px;
      height: 32px;
      padding: 0 10px;
      border-radius: 10px;
    }

    .company-detail{
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
      display:none;
      font-size:14px;
    }

    .kv{
      display:grid;
      grid-template-columns: 90px 1fr;
      row-gap:10px;
      column-gap:14px;
      margin-top: 6px;
    }
    .kv .k{ font-weight: 900; color:#111827; }
    .kv .v{ word-break: break-word; color:#344054; }

    .admin-actions{
      margin-top: 14px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    /* ===== Pagination & message ===== */
    #pagination{
      text-align:center;
      margin-top: 18px;
      font-size: 14px;
    }
    .page-link{
      display:inline-block;
      margin: 0 6px;
      cursor:pointer;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    .page-link:hover{ background:#f2f4f7; }
    .page-link.active{
      font-weight: 900;
      border-color: rgba(37,99,235,.25);
      background: rgba(37,99,235,.08);
    }

    .message{
      text-align:center;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      white-space: pre-line;
    }

    /* ===== Modal ===== */
    .backdrop{
      position: fixed;
      inset: 0;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      background: rgba(16,24,40,.45);
      z-index: 9999;
    }
    .modal{
      width: 560px;
      max-width: calc(100vw - 32px);
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
    }
    .modal h2{
      margin: 4px 0 12px;
      font-size: 16px;
      letter-spacing: .02em;
    }
    .field{ margin: 10px 0; }
    .field label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      padding-left: 2px;
    }
    .field input{
      width:100%;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      box-sizing:border-box;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      background:#fff;
    }
    .field input:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:12px;
      flex-wrap: wrap;
    }

    .error{
      color: var(--danger);
      font-size: 12px;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    @media (max-width: 900px){
      :root{ --pad: 16px; }
    }
    @media (max-width: 520px){
      .btn{ width: 100%; }
      .btn.tiny{ width: auto; }
      .kv{ grid-template-columns: 80px 1fr; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <nav class="nav">
      <a href="adminevents.html">説明会情報管理</a>
      <a class="is-active" href="admincompanies.html">会社情報管理</a>

      <!-- ★ super_admin のときだけ表示 -->
      <a href="super_admin_user_manage.html" id="userManageLink" style="display:none;">ユーザー管理</a>
      <a href="teacherRegister.html" id="teacherRegisterLink" style="display:none;">新規教師登録</a>

      <a href="teacher_mypage.html" id="accountLink">アカウント</a>
      <a href="#" id="logoutLink" class="danger-link">ログアウト</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-title">
    <h1>会社情報管理</h1>
    <p class="hint">登録・閲覧・編集はポップアップで行います（管理者のみ）。</p>
  </div>

  <div class="toolbar">
    <div></div>
    <button class="btn btn-primary" id="openModalBtn">会社を新規登録</button>
  </div>

  <!-- 検索（会社名・所在地） -->
  <div class="panel">
    <div class="row">
      <input id="qName" class="input" type="text" placeholder="会社名で検索" style="width:min(320px,100%);" />
      <input id="qAddress" class="input" type="text" placeholder="所在地で検索" style="width:min(320px,100%);" />
      <button id="searchBtn" class="btn">検索</button>
      <button id="clearBtn" class="btn">クリア</button>
    </div>
    <div class="hint-text">＊ 登録・閲覧・編集はポップアップBOXで表示します。</div>
  </div>

  <div id="companyList"></div>
  <div id="message" class="message"></div>
  <div id="pagination"></div>
</main>

<!-- Modal（新規登録） -->
<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>会社新規登録</h2>

    <div class="field">
      <label>会社名（必須）</label>
      <input id="m_name" />
    </div>

    <div class="field">
      <label>所在地</label>
      <input id="m_address" />
    </div>

    <div class="field">
      <label>公式サイト</label>
      <input id="m_website" placeholder="https://..." />
    </div>

    <div class="actions">
      <button class="btn" id="closeModalBtn">キャンセル</button>
      <button class="btn btn-primary" id="saveBtn">登録</button>
    </div>

    <div class="error" id="modalMsg"></div>
  </div>
</div>

<!-- Modal（編集） -->
<div class="backdrop" id="editBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>会社情報 編集</h2>

    <div class="field">
      <label>会社名（必須）</label>
      <input id="e_name" />
    </div>

    <div class="field">
      <label>所在地</label>
      <input id="e_address" />
    </div>

    <div class="field">
      <label>公式サイト</label>
      <input id="e_website" placeholder="https://..." />
    </div>

    <div class="actions">
      <button class="btn" id="editCancelBtn">キャンセル</button>
      <button class="btn btn-primary" id="editSaveBtn">更新</button>
    </div>

    <div class="error" id="editMsg"></div>
  </div>
</div>

<!-- Modal（削除確認） -->
<div class="backdrop" id="deleteBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>削除確認</h2>
    <div id="deleteText" style="font-size:14px; line-height:1.6;"></div>

    <div class="actions">
      <button class="btn" id="deleteCancelBtn">キャンセル</button>
      <button class="btn btn-danger" id="deleteOkBtn">削除する</button>
    </div>

    <div class="error" id="deleteMsg"></div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080"; //外部公開用

  const token = localStorage.getItem("token");
  const roleRaw = localStorage.getItem("role"); // "normal_admin" / "super_admin"
  const roleUpper = roleRaw ? roleRaw.toUpperCase() : "";

  // ★ normal_admin / super_admin を「管理者」として扱う
  const isAdmin = (roleUpper === "NORMAL_ADMIN" || roleUpper === "SUPER_ADMIN");
  const isSuperAdmin = (roleUpper === "SUPER_ADMIN");

  function setupSuperAdminHeaderLinks() {
    const userManageLink = document.getElementById("userManageLink");
    const teacherRegisterLink = document.getElementById("teacherRegisterLink");
    const accountLink = document.getElementById("accountLink");

    if (userManageLink) userManageLink.style.display = isSuperAdmin ? "inline" : "none";
    if (teacherRegisterLink) teacherRegisterLink.style.display = isSuperAdmin ? "inline" : "none";

    if (accountLink) {
      if (isSuperAdmin) {
        accountLink.href = "super_admin_mypage.html";
      } else {
        accountLink.href = "teacher_mypage.html";
        accountLink.textContent = "アカウント";
      }
    }
  }

  const listEl = document.getElementById("companyList");
  const msgEl = document.getElementById("message");
  const paginationEl = document.getElementById("pagination");

  // ★検索入力
  const qNameEl = document.getElementById("qName");
  const qAddressEl = document.getElementById("qAddress");
  const searchBtn = document.getElementById("searchBtn");
  const clearBtn = document.getElementById("clearBtn");

  // 新規登録
  const backdrop = document.getElementById("backdrop");
  const openModalBtn = document.getElementById("openModalBtn");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const saveBtn = document.getElementById("saveBtn");
  const modalMsg = document.getElementById("modalMsg");

  // 編集
  const editBackdrop = document.getElementById("editBackdrop");
  const eName = document.getElementById("e_name");
  const eAddress = document.getElementById("e_address");
  const eWebsite = document.getElementById("e_website");
  const editCancelBtn = document.getElementById("editCancelBtn");
  const editSaveBtn = document.getElementById("editSaveBtn");
  const editMsg = document.getElementById("editMsg");

  // 削除
  const deleteBackdrop = document.getElementById("deleteBackdrop");
  const deleteText = document.getElementById("deleteText");
  const deleteCancelBtn = document.getElementById("deleteCancelBtn");
  const deleteOkBtn = document.getElementById("deleteOkBtn");
  const deleteMsg = document.getElementById("deleteMsg");

  // 新規入力
  const mName = document.getElementById("m_name");
  const mAddress = document.getElementById("m_address");
  const mWebsite = document.getElementById("m_website");

  const PAGE_SIZE = 10;
  let currentPage = 1;
  let totalPages = 1;

  let editingCompanyId = null;
  let deletingCompanyId = null;

  if (!token) {
    msgEl.textContent = "JWTトークンがありません。先に管理者でログインしてください。";
  }
  if (!isAdmin) {
    openModalBtn.disabled = true;
    openModalBtn.title = "管理者のみ操作できます";
  }

  // ログアウト
  document.getElementById("logoutLink").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("email");
    localStorage.removeItem("name");
    localStorage.removeItem("role");
    alert("ログアウトしました。");
    window.location.href = "index.html";
  });

  // ===== modal open/close =====
  function openBackdrop(bd){
    bd.style.display = "flex";
    bd.setAttribute("aria-hidden","false");
  }
  function closeBackdrop(bd){
    bd.style.display = "none";
    bd.setAttribute("aria-hidden","true");
  }

  openModalBtn.onclick = () => {
    if (!isAdmin) return;
    modalMsg.textContent = "";
    mName.value = "";
    mAddress.value = "";
    mWebsite.value = "";
    openBackdrop(backdrop);
  };
  closeModalBtn.onclick = () => closeBackdrop(backdrop);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeBackdrop(backdrop); });

  editCancelBtn.onclick = () => closeBackdrop(editBackdrop);
  editBackdrop.addEventListener("click", (e) => { if (e.target === editBackdrop) closeBackdrop(editBackdrop); });

  deleteCancelBtn.onclick = () => closeBackdrop(deleteBackdrop);
  deleteBackdrop.addEventListener("click", (e) => { if (e.target === deleteBackdrop) closeBackdrop(deleteBackdrop); });

  // Escで閉じる
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    [backdrop, editBackdrop, deleteBackdrop].forEach(bd => {
      if (bd.style.display === "flex") closeBackdrop(bd);
    });
  });

  // ===== 検索 =====
  function doSearch() { loadCompanies(1); }
  searchBtn.onclick = doSearch;
  clearBtn.onclick = () => {
    qNameEl.value = "";
    qAddressEl.value = "";
    loadCompanies(1);
  };
  [qNameEl, qAddressEl].forEach(el => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
  });

  // ===== data load =====
  async function loadCompanies(page) {
    if (page < 1) page = 1;

    const qName = qNameEl.value.trim();
    const qAddress = qAddressEl.value.trim();

    const qs = new URLSearchParams({ page: String(page), size: String(PAGE_SIZE) });
    if (qName) qs.set("qName", qName);
    if (qAddress) qs.set("qAddress", qAddress);

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies?${qs.toString()}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (!res.ok) throw new Error("HTTP status " + res.status);

      const data = await res.json();
      const items = data.items ?? [];
      currentPage = data.page ?? page;
      totalPages = data.totalPages ?? 1;

      renderCompanies(items);
      renderPagination();
      renderMessage(data.totalItems ?? items.length, qName, qAddress);
    } catch (err) {
      console.error(err);
      listEl.innerHTML = "";
      paginationEl.innerHTML = "";
      msgEl.textContent = "会社情報の取得に失敗しました。サーバーを確認してください。";
    }
  }

  function renderCompanies(companies) {
    listEl.innerHTML = "";
    if (!companies || companies.length === 0) return;

    for (const c of companies) {
      const card = document.createElement("div");
      card.className = "company-card";

      const header = document.createElement("div");
      header.className = "company-header";

      const title = document.createElement("div");
      title.className = "company-title";
      title.textContent = c.name ?? "会社名未設定";

      const toggleBtn = document.createElement("button");
      toggleBtn.className = "btn tiny";
      toggleBtn.textContent = "▽ 詳細表示";

      header.appendChild(title);
      header.appendChild(toggleBtn);

      const detail = document.createElement("div");
      detail.className = "company-detail";

      detail.innerHTML = `
        <div class="kv">
          <div class="k">所在地</div><div class="v">${escapeHtml(c.address ?? "未設定")}</div>
          <div class="k">公式サイト</div><div class="v">${escapeHtml(c.website ?? "未設定")}</div>
        </div>
      `;

      if (isAdmin) {
        const actions = document.createElement("div");
        actions.className = "admin-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "btn";
        editBtn.textContent = "編集";
        editBtn.addEventListener("click", () => openEditModal(c));

        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-danger";
        delBtn.textContent = "削除";
        delBtn.addEventListener("click", () => openDeleteModal(c));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        detail.appendChild(actions);
      }

      toggleBtn.addEventListener("click", () => {
        const isOpen = detail.style.display === "block";
        detail.style.display = isOpen ? "none" : "block";
        toggleBtn.textContent = isOpen ? "▽ 詳細表示" : "△ 閉じる";
      });

      card.appendChild(header);
      card.appendChild(detail);
      listEl.appendChild(card);
    }
  }

  function renderPagination() {
    paginationEl.innerHTML = "";
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
      const span = document.createElement("span");
      span.className = "page-link" + (i === currentPage ? " active" : "");
      span.textContent = String(i);
      span.addEventListener("click", () => loadCompanies(i));
      paginationEl.appendChild(span);
    }

    if (currentPage < totalPages) {
      const next = document.createElement("span");
      next.className = "page-link";
      next.textContent = ">>next";
      next.addEventListener("click", () => loadCompanies(currentPage + 1));
      paginationEl.appendChild(next);
    }
  }

  function renderMessage(totalItems, qName, qAddress) {
    if (!totalItems || totalItems === 0) {
      const lines = [];
      lines.push("該当する会社情報がありません。");
      if (qName || qAddress) {
        lines.push("");
        lines.push("【検索条件】");
        if (qName) lines.push("・会社名: " + qName);
        if (qAddress) lines.push("・所在地: " + qAddress);
      }
      msgEl.textContent = lines.join("\n");
    } else {
      msgEl.textContent = "";
    }
  }

  // ===== create =====
  saveBtn.onclick = async () => {
    if (!isAdmin) return;

    modalMsg.textContent = "";
    saveBtn.disabled = true;

    const payload = {
      name: mName.value.trim(),
      address: mAddress.value.trim(),
      website: mWebsite.value.trim()
    };

    if (!payload.name) {
      modalMsg.textContent = "会社名は必須です";
      saveBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let msg = "";
        try {
          const err = await res.json();
          msg = err.message ?? JSON.stringify(err);
        } catch {
          msg = await res.text();
        }
        modalMsg.textContent = `登録失敗: ${res.status} ${msg}`;
        saveBtn.disabled = false;
        return;
      }

      closeBackdrop(backdrop);
      saveBtn.disabled = false;

      await loadCompanies(1);
    } catch (e) {
      console.error(e);
      modalMsg.textContent = "通信に失敗しました。サーバーを確認してください。";
      saveBtn.disabled = false;
    }
  };

  // ===== edit open/save =====
  function openEditModal(company) {
    if (!isAdmin) return;

    editMsg.textContent = "";
    editingCompanyId = company.companyId;

    eName.value = company.name ?? "";
    eAddress.value = company.address ?? "";
    eWebsite.value = company.website ?? "";

    openBackdrop(editBackdrop);
  }

  editSaveBtn.onclick = async () => {
    if (!isAdmin) return;

    editMsg.textContent = "";
    editSaveBtn.disabled = true;

    const payload = {
      name: eName.value.trim(),
      address: eAddress.value.trim(),
      website: eWebsite.value.trim()
    };

    if (!payload.name) {
      editMsg.textContent = "会社名は必須です";
      editSaveBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies/${editingCompanyId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let msg = "";
        try { msg = (await res.json()).message ?? ""; } catch { msg = await res.text(); }
        editMsg.textContent = `更新失敗: ${res.status} ${msg}`;
        editSaveBtn.disabled = false;
        return;
      }

      alert("更新しました。");
      closeBackdrop(editBackdrop);
      editSaveBtn.disabled = false;

      await loadCompanies(currentPage);
    } catch (e) {
      console.error(e);
      editMsg.textContent = "通信に失敗しました。サーバーを確認してください。";
      editSaveBtn.disabled = false;
    }
  };

  // ===== delete open/ok =====
  function openDeleteModal(company) {
    if (!isAdmin) return;

    deleteMsg.textContent = "";
    deletingCompanyId = company.companyId;

    deleteText.innerHTML = `
      <div>この会社を削除します。よろしいですか？</div>
      <div style="margin-top:10px;">
        <div><b>会社名：</b>${escapeHtml(company.name ?? "")}</div>
        <div><b>所在地：</b>${escapeHtml(company.address ?? "")}</div>
        <div><b>公式サイト：</b>${escapeHtml(company.website ?? "")}</div>
      </div>
      <div style="margin-top:10px; color:#667085; font-size:12px;">
        ※ 説明会に紐づいている会社は削除できません。
      </div>
    `;

    openBackdrop(deleteBackdrop);
  }

  deleteOkBtn.onclick = async () => {
    if (!isAdmin) return;

    deleteMsg.textContent = "";
    deleteOkBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/admin/companies/${deletingCompanyId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!res.ok) {
        let msg = "";
        try { msg = (await res.json()).message ?? ""; } catch { msg = await res.text(); }
        deleteMsg.textContent = `削除失敗: ${res.status} ${msg}`;
        deleteOkBtn.disabled = false;
        return;
      }

      alert("削除しました。");
      closeBackdrop(deleteBackdrop);
      deleteOkBtn.disabled = false;

      await loadCompanies(currentPage);
    } catch (e) {
      console.error(e);
      deleteMsg.textContent = "通信に失敗しました。サーバーを確認してください。";
      deleteOkBtn.disabled = false;
    }
  };

  function escapeHtml(str) {
    return String(str ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  window.addEventListener("load", () => {
    setupSuperAdminHeaderLinks();
    loadCompanies(1);
  });
</script>

</body>
</html>
