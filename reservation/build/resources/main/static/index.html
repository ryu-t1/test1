<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>説明会一覧（学生用）</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }

    header {
      border-bottom: 1px solid #ccc;
      padding: 16px 40px;
      display: flex;
      justify-content: center;
      gap: 80px;
      font-size: 14px;
      background-color: #fff;
    }
    header a {
      text-decoration: none;
      color: #333;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: 30px auto 60px;
      padding: 0 16px;
    }

    .search-box {
      margin: 0 auto 30px;
      max-width: 760px;
      border: 1px solid #333;
      padding: 16px;
      text-align: center;
      background-color: #fff;
    }

    .search-row{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .search-box input {
      padding: 6px 8px;
      box-sizing: border-box;
    }

    #keyword { width: 320px; }
    #fromDt, #toDt { width: 210px; }

    .search-box button {
      padding: 6px 12px;
      cursor: pointer;
    }

    #eventList { margin-top: 20px; }

    .event-card {
      border: 1px solid #333;
      background-color: #fff;
      margin-bottom: 12px;
    }

    /* ヘッダー（左：会社名/開催日/場所、右：予約人数 + 詳細ボタン） */
    .event-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: default;
      gap: 12px;
    }

    .event-main-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .event-title {
      font-weight: bold;
    }

    .event-sub { font-size: 13px; }

    /* ★右側のまとまり（予約人数 + 詳細ボタン） */
    .event-right{
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .detail-toggle-btn {
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    /* ★予約人数（ヘッダー内・右側・他の文字と同程度） */
    .reservation-count-inline{
      font-size: 13px; /* event-sub と同じくらい */
      color: #333;
      white-space: nowrap;
    }
    .reservation-count-inline .label{
      color:#555;
      margin-right: 4px;
    }
    .reservation-count-inline .value{
      font-weight: bold; /* 強調は太字だけ */
      color:#111;
    }

    .event-detail {
      border-top: 1px solid #333;
      padding: 10px 16px 14px;
      display: none;
      font-size: 14px;
    }

    .event-detail-title {
      font-weight: bold;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    /* ★詳細内のリンク見た目 */
    .detail-link a{
      color:#0066cc;
      text-decoration: underline;
      word-break: break-all;
    }

    .reserve-btn {
      margin-top: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }

    #pagination {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
    }

    .page-link {
      display: inline-block;
      margin: 0 6px;
      cursor: pointer;
    }

    .page-link.active {
      font-weight: bold;
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
  </style>
  </head>
  <body>

    <header>
      <a href="index.html">説明会一覧</a>
      <a href="reservations.html">予約確認</a>
      <a id="loginLink" href="login.html">ログイン</a>
      <a id="registerLink" href="register.html">新規登録</a>
      <a href="mypage.html">アカウント</a>
    </header>

    <main>
      <!-- 検索フォーム（本当に検索する版） -->
      <div class="search-box">
        <div class="search-row">
          <input id="keyword" type="text" placeholder="会社名・説明会名で検索">
          <input id="fromDt" type="datetime-local">
          <input id="toDt" type="datetime-local">
          <button id="searchBtn">検索</button>
          <button id="clearBtn" type="button">クリア</button>
        </div>
        <div style="font-size:12px;color:#666;">
          ※ 表示対象は「今年度3月〜次年度3月」の説明会のみ（サーバ側で自動切替）
        </div>
      </div>

      <div id="eventList"></div>
      <div id="message" class="message"></div>
      <div id="pagination"></div>
    </main>

    <script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080";
  const PAGE_SIZE = 10;

  let currentPage = 0;
  let totalPages = 1;

  function getLoginInfo() {
    const token = localStorage.getItem("token");
    const roleRaw = localStorage.getItem("role");
    const role = roleRaw ? roleRaw.toUpperCase() : null;
    return { token, role };
  }

  function isDeadlineOver(deadlineStr) {
    if (!deadlineStr) return false;
    const d = new Date(deadlineStr);
    if (Number.isNaN(d.getTime())) return false;
    const today = new Date();
    d.setHours(0,0,0,0);
    today.setHours(0,0,0,0);
    return d < today;
  }

  function setupHeaderByLoginStatus() {
    const loginLink = document.getElementById("loginLink");
    const registerLink = document.getElementById("registerLink");
    const { token } = getLoginInfo();

    if (!loginLink) return;

    if (token) {
      loginLink.textContent = "ログアウト";
      loginLink.href = "#";

      loginLink.replaceWith(loginLink.cloneNode(true));
      const newLoginLink = document.getElementById("loginLink");

      newLoginLink.addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("token");
        localStorage.removeItem("userId");
        localStorage.removeItem("email");
        localStorage.removeItem("name");
        localStorage.removeItem("role");
        alert("ログアウトしました。");
        window.location.href = "index.html";
      });

      if (registerLink) registerLink.style.display = "none";
    } else {
      loginLink.textContent = "ログイン";
      loginLink.href = "login.html";
      if (registerLink) registerLink.style.display = "inline";
    }
  }

  // datetime-local → "yyyy-MM-dd HH:mm:ss"
  function toSqlDateTime(dtLocalValue) {
    if (!dtLocalValue) return "";
    return dtLocalValue.replace("T", " ") + ":00";
  }

  function getSearchParamsFromUI() {
    const q = document.getElementById("keyword").value.trim();
    const from = toSqlDateTime(document.getElementById("fromDt").value);
    const to = toSqlDateTime(document.getElementById("toDt").value);
    return { q, from, to };
  }

  async function loadEvents(page) {
    if (page < 0) page = 0;

    const { q, from, to } = getSearchParamsFromUI();

    const params = new URLSearchParams({
      page: page,
      size: PAGE_SIZE
    });

    if (q) params.append("q", q);
    if (from) params.append("from", from);
    if (to) params.append("to", to);

    try {
      const res = await fetch(`${API_BASE}/events?` + params.toString());
      if (!res.ok) throw new Error("HTTP status " + res.status);

      const data = await res.json();
      currentPage = data.page;
      totalPages = data.totalPages;

      renderEvents(data.events);
      renderPagination();
      renderMessage(data.totalCount);
    } catch (err) {
      console.error(err);
      document.getElementById("eventList").innerHTML = "";
      document.getElementById("pagination").innerHTML = "";
      document.getElementById("message").textContent =
        "説明会情報の取得に失敗しました。サーバーを確認してください。";
    }
  }

  // ★ http(s) が付いてない場合に補正（任意）
  function normalizeUrl(url) {
    if (!url) return "";
    const u = url.trim();
    if (!u) return "";
    if (u.startsWith("http://") || u.startsWith("https://")) return u;
    return "https://" + u;
  }

  // ★予約人数を取得（トークン不要・人数だけ）
  async function fetchReservationCount(eventId) {
    const res = await fetch(`${API_BASE}/events/${eventId}/reservations/count`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json(); // int
  }

  function renderEvents(events) {
    const list = document.getElementById("eventList");
    list.innerHTML = "";

    const loginInfo = getLoginInfo();
    const isStudent = loginInfo.role === "STUDENT";

    events.forEach(event => {
      const card = document.createElement("div");
      card.className = "event-card";

      // --------------------------
      // ヘッダー
      // --------------------------
      const header = document.createElement("div");
      header.className = "event-header";

      // 左：会社名/開催日/場所
      const mainInfo = document.createElement("div");
      mainInfo.className = "event-main-info";

      const title = document.createElement("div");
      title.className = "event-title";
      title.textContent = event.companyName ?? "会社名未設定";

      const sub1 = document.createElement("div");
      sub1.className = "event-sub";
      sub1.textContent = `開催日：${event.date ?? "未定"}`;

      const sub2 = document.createElement("div");
      sub2.className = "event-sub";
      sub2.textContent = `場所：${event.place ?? "未定"}`;

      mainInfo.appendChild(title);
      mainInfo.appendChild(sub1);
      mainInfo.appendChild(sub2);

      // 右：予約人数 + 詳細ボタン
      const rightWrap = document.createElement("div");
      rightWrap.className = "event-right";

      const countInline = document.createElement("div");
      countInline.className = "reservation-count-inline";

      const countLabel = document.createElement("span");
      countLabel.className = "label";
      countLabel.textContent = "現在の予約：";

      const countValue = document.createElement("span");
      countValue.className = "value";
      countValue.textContent = "取得中…";

      countInline.appendChild(countLabel);
      countInline.appendChild(countValue);

      const toggleBtn = document.createElement("button");
      toggleBtn.className = "detail-toggle-btn";
      toggleBtn.textContent = "▽ 詳細表示";

      rightWrap.appendChild(countInline);
      rightWrap.appendChild(toggleBtn);

      header.appendChild(mainInfo);
      header.appendChild(rightWrap);

      // ヘッダー表示時に人数取得
      (async () => {
        try {
          const n = await fetchReservationCount(event.eventId);
          countValue.textContent = `${n}人`;
        } catch (e) {
          console.error(e);
          countValue.textContent = "取得失敗";
        }
      })();

      // --------------------------
      // アコーディオン詳細
      // --------------------------
      const detail = document.createElement("div");
      detail.className = "event-detail";

      const deadlineTitle = document.createElement("div");
      deadlineTitle.className = "event-detail-title";
      deadlineTitle.textContent = "締切";

      const deadlineBody = document.createElement("div");
      deadlineBody.textContent = event.deadline || "締切は未設定です。";

      const itemTitle = document.createElement("div");
      itemTitle.className = "event-detail-title";
      itemTitle.textContent = "持ち物";

      const itemBody = document.createElement("div");
      itemBody.textContent = event.item || "持ち物情報は未登録です。";

      const noteTitle = document.createElement("div");
      noteTitle.className = "event-detail-title";
      noteTitle.textContent = "説明";

      const noteBody = document.createElement("div");
      noteBody.textContent = event.note || "詳細情報は未登録です。";

      const webTitle = document.createElement("div");
      webTitle.className = "event-detail-title";
      webTitle.textContent = "会社Web";

      const webBody = document.createElement("div");
      webBody.className = "detail-link";
      if (event.companyWebsite) {
        const a = document.createElement("a");
        a.href = normalizeUrl(event.companyWebsite);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = event.companyWebsite;
        webBody.appendChild(a);
      } else {
        webBody.textContent = "未登録です。";
      }

      const reserveBtn = document.createElement("button");
      reserveBtn.className = "reserve-btn";
      reserveBtn.textContent = "予約する";

      const deadlineOver = isDeadlineOver(event.deadline);

      if (deadlineOver) {
        reserveBtn.disabled = true;
        reserveBtn.style.backgroundColor = "#ccc";
        reserveBtn.style.cursor = "not-allowed";
        reserveBtn.textContent = "締切済み";
      } else if (!isStudent) {
        reserveBtn.disabled = true;
        reserveBtn.style.backgroundColor = "#ccc";
        reserveBtn.style.cursor = "not-allowed";
        reserveBtn.textContent = "学生のみ予約可";
      } else {
        reserveBtn.addEventListener("click", async () => {
          const ok = window.confirm(
            `この説明会を予約しますか？\n\n` +
            `会社名：${event.companyName ?? "会社名未設定"}\n` +
            `開催日：${event.date ?? "未定"}\n` +
            `場所：${event.place ?? "未定"}`
          );
          if (!ok) return;

          const token = loginInfo.token;
          if (!token) {
            alert("予約にはログインが必要です。ログイン画面から再度ログインしてください。");
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/events/${event.eventId}/reservations`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
              }
            });

            if (res.ok) {
              alert("予約が完了しました。");
              // ★予約後に人数も更新（右側の表示を更新）
              try {
                const n = await fetchReservationCount(event.eventId);
                countValue.textContent = `${n}人`;
              } catch (e) {
                console.error(e);
              }
            } else if (res.status === 400 || res.status === 409) {
              const msg = await res.text();
              alert("予約に失敗しました: " + msg);
            } else if (res.status === 401 || res.status === 403) {
              alert("権限がありません。学生アカウントでログインしてください。");
            } else {
              alert("予期しないエラーが発生しました。");
            }
          } catch (e) {
            console.error(e);
            alert("サーバーとの通信に失敗しました。");
          }
        });
      }

      detail.appendChild(deadlineTitle);
      detail.appendChild(deadlineBody);

      detail.appendChild(webTitle);
      detail.appendChild(webBody);

      detail.appendChild(itemTitle);
      detail.appendChild(itemBody);

      detail.appendChild(noteTitle);
      detail.appendChild(noteBody);

      detail.appendChild(reserveBtn);

      toggleBtn.addEventListener("click", () => {
        const isOpen = detail.style.display === "block";
        detail.style.display = isOpen ? "none" : "block";
        toggleBtn.textContent = isOpen ? "▽ 詳細表示" : "△ 閉じる";
      });

      card.appendChild(header);
      card.appendChild(detail);
      list.appendChild(card);
    });
  }

  function renderPagination() {
    const container = document.getElementById("pagination");
    container.innerHTML = "";

    if (totalPages <= 1) return;

    for (let i = 0; i < totalPages; i++) {
      const span = document.createElement("span");
      span.className = "page-link" + (i === currentPage ? " active" : "");
      span.textContent = (i + 1);
      span.addEventListener("click", () => loadEvents(i));
      container.appendChild(span);
    }

    if (currentPage < totalPages - 1) {
      const next = document.createElement("span");
      next.className = "page-link";
      next.textContent = ">>next";
      next.addEventListener("click", () => loadEvents(currentPage + 1));
      container.appendChild(next);
    }
  }

  function renderMessage(totalCount) {
    const msg = document.getElementById("message");
    msg.textContent = (totalCount === 0) ? "条件に一致する説明会がありません。" : "";
  }

  window.addEventListener("load", () => {
    setupHeaderByLoginStatus();
    loadEvents(0);

    document.getElementById("searchBtn").addEventListener("click", () => loadEvents(0));

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("keyword").value = "";
      document.getElementById("fromDt").value = "";
      document.getElementById("toDt").value = "";
      loadEvents(0);
    });

    document.getElementById("keyword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadEvents(0);
    });
  });
</script>

  </body>
</html>
