<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>全ユーザ管理（super_admin）</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow: 0 10px 30px rgba(16,24,40,.08);
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --radius:14px;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --danger-bg: rgba(180,35,24,.08);
      --focus: 0 0 0 4px rgba(37,99,235,.18);
      --container: 1120px;
      --content: 980px;
      --pad: 24px;
    }

    *{ box-sizing:border-box; }
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin:0;
      background: var(--bg);
      background-image: radial-gradient(1200px 520px at 50% -180px, rgba(37,99,235,.10), rgba(37,99,235,0));
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 72px;
    }

    /* ===== Header（index.html と同じ統一スタイル） ===== */
    header{
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      /* “中央らへんでいい感じに分散”：
         1) nav自体は中央配置
         2) navの中身は等間隔に分散
         3) ただし巨大画面でも広がりすぎないよう max-width を持たせる */
      .header-inner{
        max-width: var(--container);
        margin: 0 auto;
        padding: 14px var(--pad);
        display:flex;
        justify-content:center;   /* navを中央に */
        align-items:center;
      }

      .nav{
        width: min(760px, 100%);  /* 広がりすぎ防止（中央らへん） */
        display:flex;
        align-items:center;
        justify-content: space-around; /* 中央付近で“分散” */
        gap: 10px;
        flex-wrap:wrap;
      }

      .nav a{
        text-decoration:none;
        color:#344054;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 999px;
        transition: background-color .15s ease, color .15s ease, transform .05s ease;
        outline: none;
        white-space: nowrap;
      }
    .nav a:hover{ background:#f2f4f7; color:#111827; }
    .nav a:active{ transform: translateY(1px); }
    .nav a:focus-visible{ box-shadow: var(--focus); }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight: 800;
      border-color: rgba(37,99,235,.20);
    }
    .nav a.danger-link{
      color:#b42318;
      border-color: rgba(180,35,24,.18);
      background: rgba(180,35,24,.06);
    }
    .nav a.danger-link:hover{
      background: rgba(180,35,24,.10);
      color:#8a1f16;
    }

    /* ===== Layout ===== */
    main{
      max-width: var(--content);
      margin: 24px auto 70px;
      padding: 0 16px;
    }

    .page-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      margin: 10px 0 12px;
    }
    .page-title h1{
      margin:0;
      font-size: 18px;
      letter-spacing: .02em;
    }
    .page-title .hint{
      margin:0;
      font-size: 12px;
      color: var(--muted);
    }

    /* ===== Components ===== */
    .panel{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 14px;
      margin-bottom: 14px;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { margin:4px 0; }

    .input{
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      font-size: 14px;
      font-family: inherit;
    }
    .input:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .btn{
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
      transition: transform .05s ease, background-color .15s ease, border-color .15s ease;
      outline: none;
      white-space: nowrap;
    }
    .btn:hover{ background:#f9fafb; }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{ box-shadow: var(--focus); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .muted{ color: var(--muted); font-size: 13px; }
    .error{ color: #b00020; font-size: 13px; }
    .ok{ color: #0a7a2f; font-size: 13px; }

    .list{ margin-top: 10px; }

    details.user{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 10px 0;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    details.user summary{
      list-style:none;
      cursor:pointer;
      padding: 14px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    details.user summary::-webkit-details-marker{ display:none; }

    .left{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .title{ font-weight: 900; }
    .meta{ font-size: 13px; color:#475467; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 720px; }
    .role{
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color:#344054;
      background:#fff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .detail{
      border-top: 1px solid var(--line);
      padding: 14px;
      background: #fbfcfe;
    }

    .grid{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
    @media (max-width: 760px){ .grid{ grid-template-columns: 1fr; } }

    .pager{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:center;
      margin: 16px 0;
    }
    @media (max-width: 900px){
      :root{ --pad: 16px; }
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <nav class="nav">
      <a href="adminevents.html">説明会情報管理</a>
      <a href="admincompanies.html">会社情報管理</a>

      <a href="super_admin_user_manage.html" class="is-active">ユーザー管理</a>
      <a href="teacherRegister.html">新規教師登録</a>

      <a href="super_admin_mypage.html" id="accountLink">アカウント</a>
      <a href="#" id="logoutLink" class="danger-link">ログアウト</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-title">
    <h1>全ユーザ管理（super_admin）</h1>
    <p class="hint">ユーザーの検索・編集、学生の学年一括変更ができます。</p>
  </div>

  <!-- 学年一括変更（仕様変更：全学年を一括で +1 / -1 のみ） -->
  <div class="panel">
    <div style="font-weight:900; margin-bottom:8px;">学生の学年 一括変更</div>
    <div class="row">
      <select id="gradeDelta" class="input" style="min-width:260px;">
        <option value="1">学年を +1 する（進級）</option>
        <option value="-1">学年を -1 する（繰り下げ）</option>
      </select>

      <button id="batchBtn" class="btn">一括変更する</button>
      <span id="batchMsg" class="muted"></span>
    </div>
    <div class="muted" style="margin-top:6px;">
      ※すべての学生の学年に対して一括適用します。
    </div>
  </div>

  <!-- 検索 -->
  <div class="panel">
    <div class="row">
      <input id="q" class="input" placeholder="ユーザ検索（氏名 / メール）" style="flex:1; min-width:240px;">

      <select id="roleFilter" class="input" style="min-width:170px;">
        <option value="">権限（すべて）</option>
        <option value="student">学生</option>
        <option value="normal_admin">教師</option>
        <option value="super_admin">管理者</option>
      </select>

      <button id="searchBtn" class="btn">検索</button>
      <button id="clearBtn" class="btn">クリア</button>

      <select id="size" class="input">
        <option value="10">10件</option>
        <option value="20">20件</option>
        <option value="30">30件</option>
        <option value="50">50件</option>
      </select>
    </div>
    <div id="msg" class="muted" style="margin-top:8px;"></div>
  </div>

  <!-- 一覧 -->
  <div class="list" id="list"></div>

  <!-- ページング -->
  <div class="pager">
    <button id="prevBtn" class="btn">前へ</button>
    <div id="pageInfo" class="muted"></div>
    <button id="nextBtn" class="btn">次へ</button>
  </div>
</main>

<script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080";
  // const API_BASE = "";

  let state = { page: 0, size: 10, q: "", role: "", total: 0, items: [] };

  function getLoginInfo() {
    const token = localStorage.getItem("token");
    const roleRaw = localStorage.getItem("role");
    const role = roleRaw ? roleRaw.toLowerCase() : null;
    return { token, role };
  }

  function setupHeaderByLoginStatus() {
    const logoutLink = document.getElementById("logoutLink");
    if (!logoutLink) return;

    const { token } = getLoginInfo();

    if (!token) {
      logoutLink.classList.remove("danger-link");
      logoutLink.textContent = "ログイン";
      logoutLink.href = "login.html";
      return;
    }

    logoutLink.classList.add("danger-link");
    logoutLink.textContent = "ログアウト";
    logoutLink.href = "#";

    logoutLink.replaceWith(logoutLink.cloneNode(true));
    const newLogoutLink = document.getElementById("logoutLink");

    newLogoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("token");
      localStorage.removeItem("userId");
      localStorage.removeItem("email");
      localStorage.removeItem("name");
      localStorage.removeItem("role");
      alert("ログアウトしました。");
      window.location.href = "index.html";
    });
  }

  function authHeaders(){
    const { token } = getLoginInfo();
    const h = { "Content-Type": "application/json" };
    if (token) h["Authorization"] = "Bearer " + token;
    return h;
  }

  function setMsg(text, type="muted"){
    const el = document.getElementById("msg");
    el.className = type;
    el.textContent = text || "";
  }

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll("\"","&quot;").replaceAll("'","&#039;");
  }

  function roleToJa(roleRaw){
    const r = (roleRaw || "").toLowerCase();
    if (r === "normal_admin") return "教師";
    if (r === "student") return "学生";
    if (r === "super_admin") return "管理者";
    return roleRaw || "-";
  }

  function isBlank(v){
    return v === null || v === undefined || String(v).trim() === "";
  }
  function readNumberOrNull(inputEl){
    const raw = inputEl.value;
    if (isBlank(raw)) return null;
    const n = Number(raw);
    if (Number.isNaN(n)) return null;
    return n;
  }

  async function load(){
    setMsg("読み込み中…");
    const qs = new URLSearchParams({ page: state.page, size: state.size });

    if (state.q && state.q.trim()) qs.set("q", state.q.trim());
    if (state.role && state.role.trim()) qs.set("role", state.role.trim());

    const res = await fetch(`${API_BASE}/super-admin/users?${qs.toString()}`, {
      method: "GET",
      headers: authHeaders()
    });

    if (!res.ok) {
      const t = await res.text().catch(()=> "");
      setMsg(`取得に失敗しました（${res.status}） ${t}`, "error");
      render([]);
      updatePager();
      return;
    }

    const data = await res.json();
    state.items = data.items || [];
    state.total = data.total ?? 0;

    setMsg(`全 ${state.total} 件 / ${state.size}件ずつ表示`);
    render(state.items);
    updatePager();
  }

  function updatePager(){
    const totalPages = Math.max(1, Math.ceil(state.total / state.size));
    document.getElementById("pageInfo").textContent = `${state.page + 1} / ${totalPages} ページ`;
    document.getElementById("prevBtn").disabled = (state.page <= 0);
    document.getElementById("nextBtn").disabled = (state.page + 1 >= totalPages);
  }

  function render(items){
    const list = document.getElementById("list");
    if (!items.length){
      list.innerHTML = `<div class="panel muted">該当ユーザがいません。</div>`;
      return;
    }

    list.innerHTML = items.map(u => {
      const roleRaw = (u.role || "");
      const role = roleRaw.toLowerCase();
      const roleLabel = escapeHtml(roleToJa(roleRaw));

      const name = escapeHtml(u.name || "");
      const email = escapeHtml(u.email || "");
      const userId = u.userId;

      const grade = (u.grade ?? "");
      const myClass = escapeHtml(u.myClass ?? "");
      const number = (u.number ?? "");

      let formHtml = `<div class="muted">このユーザは編集対象外です（学生 / 教師 のみ編集可能）</div>`;

      if (role === "student") {
        formHtml = `
          <div class="grid">
            <div>
              <div class="muted">学年</div>
              <input class="input" type="number" id="grade-${userId}" value="${grade}" />
            </div>
            <div>
              <div class="muted">クラス</div>
              <input class="input" type="text" id="class-${userId}" value="${myClass}" />
            </div>
            <div>
              <div class="muted">番号</div>
              <input class="input" type="number" id="number-${userId}" value="${number}" />
            </div>
          </div>
          <div class="row" style="margin-top:12px;">
            <button class="btn" onclick="saveStudent(${userId})">保存</button>
            <span id="saveMsg-${userId}" class="muted"></span>
          </div>
        `;
      } else if (role === "normal_admin") {
        formHtml = `
          <div class="grid">
            <div>
              <div class="muted">担当学年</div>
              <input class="input" type="number" id="grade-${userId}" value="${grade}" />
            </div>
            <div>
              <div class="muted">担当クラス</div>
              <input class="input" type="text" id="class-${userId}" value="${myClass}" />
            </div>
            <div></div>
          </div>
          <div class="row" style="margin-top:12px;">
            <button class="btn" onclick="saveTeacher(${userId})">保存</button>
            <span id="saveMsg-${userId}" class="muted"></span>
          </div>
        `;
      }

      const metaLine3 = `学年：${u.grade ?? "-"} ／ クラス：${escapeHtml(u.myClass ?? "-")} ／ 番号：${u.number ?? "-"}`;

      return `
        <details class="user">
          <summary>
            <div class="left">
              <div class="title">${name}</div>
              <div class="meta">${email}</div>
              <div class="meta">${metaLine3}</div>
            </div>
            <div class="role">${roleLabel}</div>
          </summary>
          <div class="detail">
            ${formHtml}
          </div>
        </details>
      `;
    }).join("");
  }

  function setSaveMsg(userId, text, type="muted"){
    const el = document.getElementById(`saveMsg-${userId}`);
    if (!el) return;
    el.className = type;
    el.textContent = text || "";
  }

  window.saveStudent = async (userId) => {
    setSaveMsg(userId, "");

    const gradeEl = document.getElementById(`grade-${userId}`);
    const classEl = document.getElementById(`class-${userId}`);
    const numberEl = document.getElementById(`number-${userId}`);

    const grade = readNumberOrNull(gradeEl);
    const myClass = (classEl.value ?? "").trim();
    const number = readNumberOrNull(numberEl);

    if (grade === null || isBlank(myClass) || number === null) {
      setSaveMsg(userId, "未入力があります（学年・クラス・番号は必須）", "error");
      return;
    }

    setSaveMsg(userId, "保存中…");

    const payload = { grade, myClass, number };

    const res = await fetch(`${API_BASE}/super-admin/users/${userId}/student`, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });

    if (!res.ok){
      const t = await res.text().catch(()=> "");
      setSaveMsg(userId, `失敗（${res.status}） ${t}`, "error");
      return;
    }
    setSaveMsg(userId, "保存しました", "ok");
    await load();
  };

  window.saveTeacher = async (userId) => {
    setSaveMsg(userId, "");

    const gradeEl = document.getElementById(`grade-${userId}`);
    const classEl = document.getElementById(`class-${userId}`);

    const grade = readNumberOrNull(gradeEl);
    const myClass = (classEl.value ?? "").trim();

    if (grade === null || isBlank(myClass)) {
      setSaveMsg(userId, "未入力があります（担当学年・担当クラスは必須）", "error");
      return;
    }

    setSaveMsg(userId, "保存中…");

    const payload = { grade, myClass };

    const res = await fetch(`${API_BASE}/super-admin/users/${userId}/teacher`, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });

    if (!res.ok){
      const t = await res.text().catch(()=> "");
      setSaveMsg(userId, `失敗（${res.status}） ${t}`, "error");
      return;
    }
    setSaveMsg(userId, "保存しました", "ok");
    await load();
  };

  document.getElementById("searchBtn").onclick = () => {
    state.q = document.getElementById("q").value || "";
    state.role = document.getElementById("roleFilter").value || "";
    state.page = 0;
    load();
  };

  document.getElementById("clearBtn").onclick = () => {
    document.getElementById("q").value = "";
    document.getElementById("roleFilter").value = "";
    state.q = "";
    state.role = "";
    state.page = 0;
    load();
  };

  document.getElementById("size").onchange = (e) => {
    state.size = Number(e.target.value);
    state.page = 0;
    load();
  };

  document.getElementById("prevBtn").onclick = () => {
    state.page = Math.max(0, state.page - 1);
    load();
  };

  document.getElementById("nextBtn").onclick = () => {
    state.page += 1;
    load();
  };

  document.getElementById("batchBtn").onclick = async () => {
    const deltaEl = document.getElementById("gradeDelta");
    const delta = Number(deltaEl.value);

    const batchMsg = document.getElementById("batchMsg");
    batchMsg.className = "muted";
    batchMsg.textContent = "";

    if (delta !== 1 && delta !== -1) {
      batchMsg.className = "error";
      batchMsg.textContent = "学年の変更は +1 / -1 のみ選べます";
      return;
    }

    const label = (delta === 1) ? "学年を +1（進級）" : "学年を -1（繰り下げ）";
    const ok = confirm(`すべての学生の${label}を一括適用します。\nよろしいですか？`);
    if (!ok) {
      batchMsg.className = "muted";
      batchMsg.textContent = "キャンセルしました";
      return;
    }

    batchMsg.textContent = "更新中…";

    const payload = { delta };

    const res = await fetch(`${API_BASE}/super-admin/students/grade-batch`, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });

    if (!res.ok){
      const t = await res.text().catch(()=> "");
      batchMsg.className = "error";
      batchMsg.textContent = `失敗（${res.status}） ${t}`;
      return;
    }

    const updated = await res.json().catch(()=> null);
    batchMsg.className = "ok";
    batchMsg.textContent = `一括変更しました（更新件数: ${updated}）`;
    await load();
  };

  window.addEventListener("load", () => {
    setupHeaderByLoginStatus();

    const { token, role } = getLoginInfo();
    if (!token) {
      alert("ログインが必要です。");
      window.location.href = "login.html";
      return;
    }
    if (role !== "super_admin") {
      alert("このページはsuper_admin専用です。");
      window.location.href = "index.html";
      return;
    }

    state.size = Number(document.getElementById("size").value);
    load();
  });
</script>
</body>
</html>
