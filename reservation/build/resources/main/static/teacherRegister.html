<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教師用新規登録（super_admin）</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --focus: 0 0 0 4px rgba(37,99,235,.18);
      --container: 1120px;
      --pad: 24px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      padding-bottom:72px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== Header ===== */
    header{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .header-inner{
      max-width: var(--container);
      margin:0 auto;
      padding:14px var(--pad);
      display:flex;
      justify-content:center;
    }
    .nav{
      width:min(760px,100%);
      display:flex;
      justify-content:space-around;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav a{
      text-decoration:none;
      color:#344054;
      font-size:13px;
      padding:8px 12px;
      border-radius:999px;
      white-space:nowrap;
    }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight:800;
    }
    .nav a.danger-link{
      color:#b42318;
      background: rgba(180,35,24,.06);
    }

    /* ===== Layout ===== */
    main{
      max-width:560px;
      margin:28px auto 0;
      padding:0 16px 40px;
    }
    h1{
      text-align:center;
      font-size:18px;
      margin:12px 0;
    }

    .form-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow: var(--shadow-sm);
      padding:18px 16px 16px;
    }

    .message{
      font-size:13px;
      margin-bottom:12px;
      white-space:pre-wrap;
    }
    .message.error{ color:var(--danger); }
    .message.success{ color:#0a7a2f; }

    .field{ margin:10px 0; }
    .field label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .field input, .field select{
      width:100%;
      height:42px;
      padding:0 12px;
      border:1px solid var(--line-strong);
      border-radius:12px;
      font-size:14px;
      outline:none;
    }
    .field input:focus, .field select:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .note{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /* ===== password toggle ===== */
    .pw-wrap{
      position:relative;
    }
    .pw-wrap input{
      padding-right:64px;
    }
    .pw-toggle{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      height:28px;
      padding:0 10px;
      border-radius:10px;
      border:1px solid var(--line-strong);
      background:#fff;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }

    /* ★見た目を●にする（type=text運用時に使う） */
    #password.masked{
      -webkit-text-security: disc; /* Safari/Chrome系 */
      text-security: disc;         /* 将来用 */
    }

    /* ===== error ===== */
    .danger{
      border-color: rgba(180,35,24,.65)!important;
      box-shadow: 0 0 0 4px rgba(180,35,24,.10)!important;
    }
    .field-error{
      color:var(--danger);
      font-size:12px;
      margin-top:6px;
      display:none;
      white-space:pre-wrap;
    }

    .actions{
      display:flex;
      justify-content:flex-end;
      margin-top:14px;
    }
    .btn{
      height:42px;
      padding:0 16px;
      border-radius:12px;
      border:1px solid var(--line-strong);
      background:#fff;
      cursor:pointer;
      font-size:13px;
    }
    .btn-primary{
      background:var(--accent);
      color:#fff;
      font-weight:800;
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <nav class="nav">
      <a href="adminevents.html">説明会情報管理</a>
      <a href="admincompanies.html">会社情報管理</a>
      <a href="super_admin_user_manage.html">ユーザー管理</a>
      <a class="is-active" href="teacherRegister.html">新規教師登録</a>
      <a href="super_admin_mypage.html">アカウント</a>
      <a href="#" id="logoutLink" class="danger-link">ログアウト</a>
    </nav>
  </div>
</header>

<main>
  <h1>教師用アカウント新規登録</h1>

  <div class="form-card">
    <div id="message" class="message"></div>

    <div class="field">
      <label>氏名</label>
      <input id="name">
      <div id="nameErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>メールアドレス</label>
      <input id="email" type="email">
      <div id="emailErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>パスワード</label>
      <div class="pw-wrap">
        <input id="password" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pwToggle">表示</button>
      </div>
      <div class="note">英数字8文字以上（記号・全角は不可）</div>
      <div id="passwordErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>担当学年</label>
      <select id="grade">
        <option value="">選択してください</option>
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
        <option value="4">4年</option>
      </select>
      <div id="gradeErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>クラス</label>
      <select id="myClass">
        <option value="">選択してください</option>
        <option>A</option><option>B</option><option>C</option>
        <option>D</option><option>E</option>
      </select>
      <div id="classErr" class="field-error"></div>
    </div>

    <div class="actions">
      <button id="registerBtn" class="btn btn-primary">登録する</button>
    </div>
  </div>
</main>

<script>
  const API_BASE = "http://localhost:8080";
  const token = localStorage.getItem("token");
  const role = (localStorage.getItem("role") || "").toUpperCase();
  const isSuperAdmin = role === "SUPER_ADMIN";

  const msgEl = document.getElementById("message");
  const registerBtn = document.getElementById("registerBtn");

  function showMessage(text, err){
    msgEl.textContent = text || "";
    msgEl.className = "message " + (err ? "error" : "success");
  }

  document.getElementById("logoutLink").onclick = e => {
    e.preventDefault();
    ["token","userId","email","name","role"].forEach(k=>localStorage.removeItem(k));
    window.location.href="index.html";
  };

  if(!token || !isSuperAdmin){
    showMessage("super_adminでログインしてください。", true);
    registerBtn.disabled = true;
  }

  /* =========================================================
     ブラウザ標準の 👁（パスワード表示アイコン）を “入力中に出さない”
     - フォーカス中は type="text" にして、見た目を●にする
     - ボタン押下時だけ実文字表示
  ========================================================= */

  const pwInput = document.getElementById("password");
  const pwToggle = document.getElementById("pwToggle");

  // 表示モードかどうか（実文字を見せるか）
  let reveal = false;

  function applyPwMode() {
    if (reveal) {
      // 実文字表示
      pwInput.type = "text";
      pwInput.classList.remove("masked");
      pwToggle.textContent = "非表示";
    } else {
      // 実文字は隠す（フォーカス中はtype=text + ●、フォーカス外はtype=password）
      const focused = (document.activeElement === pwInput);

      if (focused) {
        // ★ここが肝：入力中にtype=passwordにしない → ブラウザ👁が出ない
        pwInput.type = "text";
        pwInput.classList.add("masked");
      } else {
        pwInput.classList.remove("masked");
        pwInput.type = "password";
      }
      pwToggle.textContent = "表示";
    }
  }

  // 初期状態
  applyPwMode();

  // 入力欄のフォーカス状態で切り替え
  pwInput.addEventListener("focus", () => applyPwMode());
  pwInput.addEventListener("blur",  () => applyPwMode());

  // ボタンで実文字表示/非表示
  pwToggle.addEventListener("click", () => {
    reveal = !reveal;
    applyPwMode();
    pwInput.focus(); // 操作感よくする
  });
</script>
</body>
</html>
