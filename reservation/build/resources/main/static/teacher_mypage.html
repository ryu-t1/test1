<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>マイページ（教師）</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow: 0 10px 30px rgba(16,24,40,.08);
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --radius:14px;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --focus: 0 0 0 4px rgba(37,99,235,.18);
      --container: 1120px;
      --pad: 24px;
    }

    *{ box-sizing:border-box; }
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(1200px 520px at 50% -180px, rgba(37,99,235,.10), rgba(37,99,235,0));
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 72px;
    }

    /* ===== Header（index.html と同じ想定の統一スタイル） ===== */
  header{
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      /* “中央らへんでいい感じに分散”：
         1) nav自体は中央配置
         2) navの中身は等間隔に分散
         3) ただし巨大画面でも広がりすぎないよう max-width を持たせる */
      .header-inner{
        max-width: var(--container);
        margin: 0 auto;
        padding: 14px var(--pad);
        display:flex;
        justify-content:center;   /* navを中央に */
        align-items:center;
      }

      .nav{
        width: min(760px, 100%);  /* 広がりすぎ防止（中央らへん） */
        display:flex;
        align-items:center;
        justify-content: space-around; /* 中央付近で“分散” */
        gap: 10px;
        flex-wrap:wrap;
      }

      .nav a{
        text-decoration:none;
        color:#344054;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 999px;
        transition: background-color .15s ease, color .15s ease, transform .05s ease;
        outline: none;
        white-space: nowrap;
      }
    .nav a:hover{ background:#f2f4f7; color:#111827; }
    .nav a:active{ transform: translateY(1px); }
    .nav a:focus-visible{ box-shadow: var(--focus); }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight: 800;
      border-color: rgba(37,99,235,.20);
    }
    .nav a.danger-link{
      color:#b42318;
      border-color: rgba(180,35,24,.18);
      background: rgba(180,35,24,.06);
    }
    .nav a.danger-link:hover{
      background: rgba(180,35,24,.10);
      color:#8a1f16;
    }

    /* ===== Page container（元デザインを維持しつつ少し今の雰囲気へ） ===== */
    .container{
      width: min(760px, calc(100% - 32px));
      margin: 44px auto 80px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding: 36px 36px;
    }

    h1{
      text-align:center;
      margin: 0 0 28px;
      letter-spacing: 0.18em;
      font-size: 22px;
    }

    .section{
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin-top: 20px;
    }
    .section:first-of-type{
      border-top:none;
      padding-top:0;
      margin-top:0;
    }

    .section-title{
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 14px;
      letter-spacing: 0.08em;
      color:#111827;
    }

    .grid{
      display:grid;
      grid-template-columns: 160px 1fr;
      gap: 10px 16px;
      align-items:center;
    }

    .label{
      font-size: 13px;
      color:#111827;
      font-weight: 700;
    }

    .value{
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #fbfcfe;
      box-sizing: border-box;
    }

    /* 未ログイン案内 */
    .need-login-box{
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: #fff;
      padding: 16px;
      margin: 0 0 18px;
    }
    .need-login-box a{
      color: var(--accent);
      text-decoration: underline;
    }

    /* モーダル（このページでは未使用だけど元CSSに合わせて残す） */
    .modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }
    .modal{
      width: 520px;
      max-width: calc(100vw - 32px);
      background: #fff;
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 26px 28px;
      box-sizing: border-box;
    }

    @media (max-width: 520px){
      .container{ padding: 22px 18px; }
      .grid{ grid-template-columns: 120px 1fr; }
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <nav class="nav">
      <a href="adminevents.html">説明会情報管理</a>
      <a href="admincompanies.html">会社情報管理</a>

      <a href="teacher_mypage.html" class="is-active">アカウント</a>

      <!-- ※ tokenが無いときはJSで「ログイン」に変わる -->
      <a href="#" id="logoutLink" class="danger-link">ログアウト</a>
    </nav>
  </div>
</header>

<div class="container">
  <h1>マイページ（教師）</h1>

  <!-- 未ログイン表示 -->
  <div id="needLoginBox" class="need-login-box" style="display:none;">
    <b>ログインが必要です</b><br>
    <a href="login.html">ログイン画面へ</a>
  </div>

  <div id="authedArea" style="display:none;">
    <div class="section">
      <div class="section-title">基本情報</div>
      <div class="grid">
        <div class="label">氏名</div>
        <div class="value" id="vName">-</div>

        <div class="label">メール</div>
        <div class="value" id="vEmail">-</div>

        <div class="label">担当学年</div>
        <div class="value" id="vGrade">-</div>

        <div class="label">担当クラス</div>
        <div class="value" id="vClass">-</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8080";
  const ME_API = "/api/teacher/me";

  function getLoginInfo() {
    return {
      token: localStorage.getItem("token"),
      role: (localStorage.getItem("role") || "").toLowerCase()
    };
  }

  function setupHeaderByLoginStatus() {
    const logoutLink = document.getElementById("logoutLink");
    const { token } = getLoginInfo();

    if (!token) {
      logoutLink.classList.remove("danger-link");
      logoutLink.textContent = "ログイン";
      logoutLink.href = "login.html";
      return;
    }

    logoutLink.classList.add("danger-link");
    logoutLink.textContent = "ログアウト";
    logoutLink.href = "#";

    // 既存イベントを消して付け直し（重複防止）
    logoutLink.replaceWith(logoutLink.cloneNode(true));
    const newLink = document.getElementById("logoutLink");

    newLink.addEventListener("click", (e) => {
      e.preventDefault();

      localStorage.removeItem("token");
      localStorage.removeItem("userId");
      localStorage.removeItem("email");
      localStorage.removeItem("name");
      localStorage.removeItem("role");

      alert("ログアウトしました。");
      window.location.href = "index.html";
    });
  }

  function renderAuthState() {
    const { token } = getLoginInfo();
    document.getElementById("needLoginBox").style.display = token ? "none" : "block";
    document.getElementById("authedArea").style.display = token ? "block" : "none";
    return !!token;
  }

  async function loadMe() {
    const { token } = getLoginInfo();
    if (!token) return;

    const res = await fetch(API_BASE + ME_API, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      localStorage.removeItem("token");
      renderAuthState();
      return;
    }

    const me = await res.json();
    document.getElementById("vName").textContent = me.name || "-";
    document.getElementById("vEmail").textContent = me.email || "-";
    document.getElementById("vGrade").textContent = me.grade ? me.grade + "年" : "-";
    document.getElementById("vClass").textContent = me.myClass || "-";
  }

  window.addEventListener("load", async () => {
    setupHeaderByLoginStatus();
    if (!renderAuthState()) return;

    const { role } = getLoginInfo();
    if (role !== "normal_admin") {
      alert("教師専用ページです");
      window.location.href = "index.html";
      return;
    }

    await loadMe();
  });
</script>

</body>
</html>
