<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイページ（学生）</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow: 0 10px 30px rgba(16,24,40,.08);
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --radius:14px;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --danger-bg: rgba(180,35,24,.08);
      --disabled:#98a2b3;
      --focus: 0 0 0 4px rgba(37,99,235,.18);

      /* layout */
      --container: 1120px;   /* header max */
      --content: 980px;      /* main max */
      --pad: 24px;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      padding-bottom: 56px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(1200px 520px at 50% -180px, rgba(37,99,235,.10), rgba(37,99,235,0));
      background-repeat: no-repeat;
      background-attachment: fixed;
      line-height:1.55;
    }

    /* ===== Header（統一） ===== */
    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .header-inner{
      max-width: var(--container);
      margin: 0 auto;
      padding: 14px var(--pad);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .nav{
      width: min(760px, 100%);
      display:flex;
      align-items:center;
      justify-content: space-around;
      gap: 10px;
      flex-wrap:wrap;
    }

    .nav a{
      text-decoration:none;
      color:#344054;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      transition: background-color .15s ease, color .15s ease, transform .05s ease;
      outline: none;
      white-space: nowrap;
    }
    .nav a:hover{ background:#f2f4f7; color:#111827; }
    .nav a:active{ transform: translateY(1px); }
    .nav a:focus-visible{ box-shadow: var(--focus); }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight:700;
      border: 1px solid rgba(37,99,235,.20);
    }

    /* ===== Layout ===== */
    main{
      max-width: var(--content);
      margin: 26px auto 0;
      padding: 0 16px 90px;
    }

    .page-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      margin: 8px 0 14px;
    }
    .page-title h1{
      margin: 0;
      font-size: 18px;
      letter-spacing: .02em;
    }
    .page-title .hint{
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .section{
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--line);
    }
    .section:first-of-type{
      padding-top: 0;
      margin-top: 0;
      border-top: none;
    }

    .section-title{
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .03em;
      margin: 0 0 12px;
    }

    .grid{
      display:grid;
      grid-template-columns: 160px 1fr;
      gap: 10px 14px;
      align-items:start;
    }

    .label{
      font-size: 12px;
      color: var(--muted);
      padding-top: 10px;
    }

    .value{
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      font-size: 14px;
      word-break: break-word;
    }

    .input{
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      font-size: 14px;
    }
    .input::placeholder{ color:#98a2b3; }
    .input:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .row{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn{
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
      transition: transform .05s ease, background-color .15s ease, border-color .15s ease;
      outline: none;
      white-space: nowrap;
    }
    .btn:hover{ background:#f9fafb; }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{ box-shadow: var(--focus); }

    .btn-primary{
      background: var(--accent);
      border-color: rgba(37,99,235,.25);
      color: #fff;
      font-weight: 800;
    }
    .btn-primary:hover{ background: var(--accent-2); }

    .btn-danger{
      border-color: rgba(180,35,24,.28);
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 800;
    }
    .btn-danger:hover{
      background: rgba(180,35,24,.12);
      border-color: rgba(180,35,24,.35);
    }

    .btn:disabled{
      background: #eef2f6;
      border-color: var(--line);
      color: var(--disabled);
      cursor: not-allowed;
      opacity: 1;
    }

    .hint{
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .error{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(180,35,24,.25);
      background: rgba(180,35,24,.06);
      color: var(--danger);
      font-size: 13px;
      display:none;
      white-space: pre-wrap;
    }

    .success{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15,81,50,.22);
      background: rgba(42,170,119,.08);
      color: #0f5132;
      font-size: 13px;
      display:none;
      white-space: pre-wrap;
    }

    .loading{
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      display: none;
      margin-top: 10px;
    }

    .box{
      background: var(--card);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      color:#555;
      margin-bottom: 14px;
    }
    .box-title{
      font-weight: 800;
      letter-spacing: .02em;
      margin-bottom: 6px;
      font-size: 13px;
      color:#111827;
    }
    .box a{
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(37,99,235,.35);
    }
    .box a:hover{ border-bottom-color: rgba(37,99,235,.85); }

    /* 入力エラー */
    .danger{
      border-color: rgba(180,35,24,.65) !important;
      box-shadow: 0 0 0 4px rgba(180,35,24,.10) !important;
      outline: none;
    }
    .field-error{
      color: var(--danger);
      font-size: 12px;
      margin-top: 6px;
      display:none;
      white-space: pre-wrap;
    }

    /* ===== Modal（統一） ===== */
    .modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(16,24,40,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }
    .modal{
      width: 560px;
      max-width: 95vw;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 18px;
    }
    .modal h2{
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: .02em;
    }
    .modal .field{
      margin-bottom: 14px;
    }
    .modal label{
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      padding-left: 2px;
    }
    .modal .actions{
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
      flex-wrap:wrap;
    }

    .password-row{
      display:flex;
      gap: 10px;
      align-items:center;
    }
    .password-row .input{ flex:1; }

    .toggle-password{
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      cursor: pointer;
      font-size: 12.5px;
      color:#111827;
      transition: background-color .15s ease, transform .05s ease;
      outline: none;
      white-space: nowrap;
    }
    .toggle-password:hover{ background:#f9fafb; }
    .toggle-password:active{ transform: translateY(1px); }
    .toggle-password:focus-visible{ box-shadow: var(--focus); }

    /* ===== Responsive ===== */
    @media (max-width: 900px){
      :root{ --pad: 16px; }
      .nav{ width: 100%; justify-content:center; }
    }
    @media (max-width: 760px){
      .grid{ grid-template-columns: 1fr; }
      .label{ padding-top: 0; }
      .row .btn{ width: 100%; }
      .row .input{ width: 100%; }
      .password-row{ flex-direction:column; align-items:stretch; }
      .toggle-password{ width: 100%; }
      .modal .actions .btn{ width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <nav class="nav">
        <a href="index.html">説明会一覧</a>
        <a href="reservations.html">予約確認</a>
        <a id="loginLink" href="login.html">ログイン</a>
        <a id="registerLink" href="register.html">新規登録</a>
        <a class="is-active" href="mypage.html">アカウント</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>マイページ</h1>
      <p class="hint">アカウント情報の確認と更新ができます。</p>
    </div>

    <div class="card">
      <!-- 未ログイン時メッセージ（リダイレクトしない） -->
      <div id="needLoginBox" class="box" style="display:none;">
        <div class="box-title">ログインが必要です</div>
        <div style="font-size:13px; color:var(--muted); line-height:1.7;">
          アカウント情報は <b>ログイン後</b> に閲覧できます。
        </div>
        <div style="margin-top:10px; font-size:13px;">
          <a href="login.html">ログイン画面へ</a>
        </div>
      </div>

      <div id="loading" class="loading">読み込み中...</div>
      <div id="pageError" class="error"></div>

      <!-- ログイン時に表示する領域 -->
      <div id="authedArea" style="display:none;">

        <!-- 基本情報 -->
        <div class="section">
          <div class="section-title">基本情報</div>
          <div class="grid">
            <div class="label">氏名</div>
            <div class="value" id="vName">-</div>

            <div class="label">メールアドレス</div>
            <div class="value" id="vEmail">-</div>

            <div class="label">学年</div>
            <div class="value" id="vGrade">-</div>

            <div class="label">クラス</div>
            <div class="value" id="vClass">-</div>

            <div class="label">出席番号</div>
            <div class="value" id="vNumber">-</div>
          </div>
          <div class="hint">※ 学年・クラス・出席番号は管理者のみ変更できます。</div>
        </div>

        <!-- メール変更 -->
        <div class="section">
          <div class="section-title">メールアドレスの変更</div>

          <div class="row">
            <input id="newEmail" class="input" type="email" placeholder="新しいメールアドレスを入力" />
            <button id="btnUpdateEmail" class="btn btn-primary">変更する</button>
          </div>

          <div id="newEmailErr" class="field-error"></div>

          <div id="emailSuccess" class="success"></div>
          <div id="emailError" class="error"></div>

          <div class="hint">変更後、再ログインが必要になる場合があります。</div>
        </div>

        <!-- パスワード変更 -->
        <div class="section">
          <div class="section-title">パスワードの変更</div>
          <button id="btnOpenPasswordModal" class="btn">パスワードを変更する</button>
          <div id="pwSuccess" class="success"></div>
          <div id="pwError" class="error"></div>
        </div>

      </div><!-- /authedArea -->
    </div><!-- /card -->
  </main>

  <!-- パスワード変更モーダル -->
  <div id="pwModalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
      <h2 id="pwModalTitle">パスワード変更</h2>

      <div class="field">
        <label for="currentPassword">現在のパスワード</label>
        <div class="password-row">
          <input id="currentPassword" class="input" type="password" placeholder="現在のパスワード" />
          <button type="button" class="toggle-password" data-target="currentPassword">表示</button>
        </div>
        <div id="currentPwErr" class="field-error"></div>
      </div>

      <div class="field">
        <label for="newPassword">新しいパスワード</label>
        <div class="password-row">
          <input id="newPassword" class="input" type="password" placeholder="新しいパスワード" />
          <button type="button" class="toggle-password" data-target="newPassword">表示</button>
        </div>
        <div class="hint">英数字8文字以上（記号・全角は不可）</div>
        <div id="newPwErr" class="field-error"></div>
      </div>

      <div class="field">
        <label for="newPassword2">新しいパスワード（確認）</label>
        <div class="password-row">
          <input id="newPassword2" class="input" type="password" placeholder="もう一度入力" />
          <button type="button" class="toggle-password" data-target="newPassword2">表示</button>
        </div>
        <div id="newPw2Err" class="field-error"></div>
      </div>

      <div id="modalError" class="error"></div>

      <div class="actions">
        <button id="btnCloseModal" class="btn">キャンセル</button>
        <button id="btnUpdatePassword" class="btn btn-primary">変更する</button>
      </div>
    </div>
  </div>

<script>
  // =============================
  // 設定（login.html と同じ）
  // =============================
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080";
  // const API_BASE = "";

  // =============================
  // 共通：ログイン情報
  // =============================
  function getLoginInfo() {
    const token = localStorage.getItem("token");
    const roleRaw = localStorage.getItem("role");
    const role = roleRaw ? roleRaw.toLowerCase() : null;
    return { token, role };
  }

  function setupHeaderByLoginStatus() {
    const loginLink = document.getElementById("loginLink");
    const registerLink = document.getElementById("registerLink");
    const { token } = getLoginInfo();

    if (!loginLink) return;

    if (token) {
      loginLink.textContent = "ログアウト";
      loginLink.href = "#";

      loginLink.replaceWith(loginLink.cloneNode(true));
      const newLoginLink = document.getElementById("loginLink");

      newLoginLink.addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("token");
        localStorage.removeItem("userId");
        localStorage.removeItem("email");
        localStorage.removeItem("name");
        localStorage.removeItem("role");
        alert("ログアウトしました。");
        renderAuthState();
      });

      if (registerLink) registerLink.style.display = "none";
    } else {
      loginLink.textContent = "ログイン";
      loginLink.href = "login.html";
      if (registerLink) registerLink.style.display = "inline";
    }
  }

  // =============================
  // 表示ヘルパー
  // =============================
  function show(el) { el.style.display = "block"; }
  function hide(el) { el.style.display = "none"; }
  function setText(id, text) { document.getElementById(id).textContent = text; }

  function clearMessages() {
    const ids = ["pageError", "emailError", "emailSuccess", "pwError", "pwSuccess", "modalError"];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = "";
      hide(el);
    });

    ["newEmailErr","currentPwErr","newPwErr","newPw2Err"].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = "";
      hide(el);
    });
  }

  function renderAuthState() {
    const { token } = getLoginInfo();
    const needLoginBox = document.getElementById("needLoginBox");
    const authedArea = document.getElementById("authedArea");

    clearMessages();

    if (!token) {
      show(needLoginBox);
      hide(authedArea);
      hide(document.getElementById("loading"));
      return false;
    } else {
      hide(needLoginBox);
      show(authedArea);
      return true;
    }
  }

  // =============================
  // バリデーション共通
  // =============================
  function setFieldError(inputEl, errEl, message) {
    if (!inputEl || !errEl) return;
    if (message) {
      inputEl.classList.add("danger");
      errEl.textContent = message;
      show(errEl);
    } else {
      inputEl.classList.remove("danger");
      errEl.textContent = "";
      hide(errEl);
    }
  }

  function validateEmailValue(email) {
    if (!email) return "";
    if (!String(email).includes("@")) return "メールアドレスは「@」を含めてください。";
    return "";
  }

  const PASS_RULE = /^[A-Za-z0-9]{8,}$/;
  function validateNewPasswordValue(pw) {
    if (!pw) return "新しいパスワードを入力してください。";
    if (!PASS_RULE.test(pw)) return "英数字のみで8文字以上にしてください（記号・全角は不可）。";
    return "";
  }

  // =============================
  // API
  // =============================
  async function apiFetch(path, options = {}) {
    const { token } = getLoginInfo();
    const headers = options.headers ? options.headers : {};
    headers["Authorization"] = "Bearer " + token;

    if (options.jsonBody !== undefined) {
      headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(options.jsonBody);
      delete options.jsonBody;
    }

    const res = await fetch(API_BASE + path, { ...options, headers });

    if (res.status === 401 || res.status === 403) {
      throw new Error("AUTH");
    }
    return res;
  }

  // =============================
  // マイ情報取得
  // =============================
  async function loadMe() {
    const loading = document.getElementById("loading");
    show(loading);

    try {
      const res = await apiFetch("/api/me", { method: "GET" });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || ("HTTP " + res.status));
      }
      const me = await res.json();

      setText("vName", me.name ?? "-");
      setText("vEmail", me.email ?? "-");
      setText("vGrade", (me.grade !== undefined && me.grade !== null) ? (me.grade + "年") : "-");
      setText("vClass", me.myClass ?? "-");
      setText("vNumber", (me.number !== undefined && me.number !== null) ? me.number : "-");

    } catch (err) {
      console.error(err);
      const pageError = document.getElementById("pageError");

      if (err.message === "AUTH") {
        pageError.textContent = "ログイン情報が無効です。もう一度ログインしてください。";
        show(pageError);

        localStorage.removeItem("token");
        renderAuthState();
      } else {
        pageError.textContent = "情報の取得に失敗しました。\n" + (err.message || "");
        show(pageError);
      }
    } finally {
      hide(loading);
    }
  }

  // =============================
  // メール更新：入力されている時だけ @ チェック
  // =============================
  function validateEmailUI() {
    const input = document.getElementById("newEmail");
    const errEl = document.getElementById("newEmailErr");
    const btn = document.getElementById("btnUpdateEmail");

    const value = input.value.trim();

    if (!value) {
      setFieldError(input, errEl, "");
      btn.disabled = true;
      return false;
    }

    const msg = validateEmailValue(value);
    setFieldError(input, errEl, msg);

    btn.disabled = !!msg;
    return !msg;
  }

  async function updateEmail() {
    clearMessages();
    if (!renderAuthState()) return;

    const input = document.getElementById("newEmail");
    const newEmail = input.value.trim();

    if (!newEmail) return;

    if (!newEmail.includes("@")) {
      setFieldError(input, document.getElementById("newEmailErr"), "メールアドレスは「@」を含めてください。");
      return;
    }

    const ok = confirm(
      "メールアドレスを変更しますか？\n\n" +
      "変更後、再ログインが必要になる場合があります。"
    );
    if (!ok) return;

    const btn = document.getElementById("btnUpdateEmail");
    btn.disabled = true;

    try {
      const res = await apiFetch("/api/me/email", {
        method: "PUT",
        jsonBody: { newEmail }
      });

      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || ("HTTP " + res.status));
      }

      const s = document.getElementById("emailSuccess");
      s.textContent = "メールアドレスを更新しました。";
      show(s);

      localStorage.setItem("email", newEmail);
      input.value = "";

      validateEmailUI();
      await loadMe();

    } catch (err) {
      console.error(err);
      const e = document.getElementById("emailError");

      if (err.message === "AUTH") {
        e.textContent = "ログイン情報が無効です。もう一度ログインしてください。";
        show(e);
        localStorage.removeItem("token");
        renderAuthState();
      } else {
        e.textContent = "更新に失敗しました。\n" + (err.message || "");
        show(e);
      }
    } finally {
      validateEmailUI();
    }
  }

  // =============================
  // パスワード更新（モーダル）
  // =============================
  const backdrop = document.getElementById("pwModalBackdrop");

  function openPasswordModal() {
    clearMessages();
    if (!renderAuthState()) return;

    document.getElementById("currentPassword").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("newPassword2").value = "";

    ["currentPassword","newPassword","newPassword2"].forEach(id => {
      const input = document.getElementById(id);
      input.classList.remove("danger");
    });
    ["currentPwErr","newPwErr","newPw2Err"].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = "";
      hide(el);
    });

    document.getElementById("btnUpdatePassword").disabled = true;

    backdrop.style.display = "flex";
    backdrop.setAttribute("aria-hidden", "false");
  }

  function closePasswordModal() {
    backdrop.style.display = "none";
    backdrop.setAttribute("aria-hidden", "true");
  }

  function validatePasswordModalUI() {
    const cur = document.getElementById("currentPassword");
    const pw1 = document.getElementById("newPassword");
    const pw2 = document.getElementById("newPassword2");

    const curErr = document.getElementById("currentPwErr");
    const pw1Err = document.getElementById("newPwErr");
    const pw2Err = document.getElementById("newPw2Err");

    let ok = true;

    if (!cur.value) {
      ok = false;
      setFieldError(cur, curErr, "現在のパスワードを入力してください。");
    } else {
      setFieldError(cur, curErr, "");
    }

    const msg1 = validateNewPasswordValue(pw1.value);
    if (msg1) {
      ok = false;
      setFieldError(pw1, pw1Err, msg1);
    } else {
      setFieldError(pw1, pw1Err, "");
    }

    if (!pw2.value) {
      ok = false;
      setFieldError(pw2, pw2Err, "確認用パスワードを入力してください。");
    } else if (pw1.value !== pw2.value) {
      ok = false;
      setFieldError(pw2, pw2Err, "新しいパスワード（確認）が一致しません。");
    } else {
      setFieldError(pw2, pw2Err, "");
    }

    document.getElementById("btnUpdatePassword").disabled = !ok;
    return ok;
  }

  async function updatePassword() {
    const modalError = document.getElementById("modalError");
    modalError.textContent = "";
    hide(modalError);

    if (!renderAuthState()) {
      closePasswordModal();
      return;
    }

    if (!validatePasswordModalUI()) {
      modalError.textContent = "入力内容を確認してください。";
      show(modalError);
      return;
    }

    const currentPassword = document.getElementById("currentPassword").value;
    const newPassword = document.getElementById("newPassword").value;

    const ok = confirm("パスワードを変更しますか？");
    if (!ok) return;

    const btn = document.getElementById("btnUpdatePassword");
    btn.disabled = true;

    try {
      const res = await apiFetch("/api/me/password", {
        method: "PUT",
        jsonBody: { currentPassword, newPassword }
      });

      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || ("HTTP " + res.status));
      }

      closePasswordModal();

      const s = document.getElementById("pwSuccess");
      s.textContent = "パスワードを更新しました。";
      show(s);

    } catch (err) {
      console.error(err);
      if (err.message === "AUTH") {
        modalError.textContent = "ログイン情報が無効です。もう一度ログインしてください。";
        show(modalError);
        localStorage.removeItem("token");
        renderAuthState();
        closePasswordModal();
      } else {
        modalError.textContent = "更新に失敗しました。\n" + (err.message || "");
        show(modalError);
        btn.disabled = !validatePasswordModalUI();
      }
    }
  }

  function setupTogglePasswords() {
    document.querySelectorAll(".toggle-password").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");
        const input = document.getElementById(targetId);
        if (!input) return;

        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        btn.textContent = isHidden ? "非表示" : "表示";
      });
    });
  }

  function setupModalBackdropClose() {
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closePasswordModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && backdrop.style.display === "flex") closePasswordModal();
    });
  }

  // =============================
  // 初期化
  // =============================
  window.addEventListener("load", async () => {
    setupHeaderByLoginStatus();

    if (!renderAuthState()) return;

    const { role } = getLoginInfo();
    if (role && role !== "student") {
      alert("このページは学生アカウント専用です。");
      window.location.href = "index.html";
      return;
    }

    setupTogglePasswords();
    setupModalBackdropClose();

    document.getElementById("btnUpdateEmail").addEventListener("click", updateEmail);
    document.getElementById("btnOpenPasswordModal").addEventListener("click", openPasswordModal);
    document.getElementById("btnCloseModal").addEventListener("click", closePasswordModal);
    document.getElementById("btnUpdatePassword").addEventListener("click", updatePassword);

    const newEmailInput = document.getElementById("newEmail");
    newEmailInput.addEventListener("input", validateEmailUI);
    newEmailInput.addEventListener("change", validateEmailUI);
    validateEmailUI();

    ["currentPassword","newPassword","newPassword2"].forEach(id => {
      const input = document.getElementById(id);
      input.addEventListener("input", validatePasswordModalUI);
      input.addEventListener("change", validatePasswordModalUI);
    });

    await loadMe();
  });
</script>
</body>
</html>
