<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生用新規登録</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow: 0 10px 30px rgba(16,24,40,.08);
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --radius:14px;
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --danger-bg: rgba(180,35,24,.08);
      --success:#0f5132;
      --success-bg: rgba(42,170,119,.10);
      --disabled:#98a2b3;
      --focus: 0 0 0 4px rgba(37,99,235,.18);

      --container: 1120px;
      --content: 980px;
      --pad: 24px;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      padding-bottom: 56px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(1200px 520px at 50% -180px, rgba(37,99,235,.10), rgba(37,99,235,0));
      background-repeat: no-repeat;
      background-attachment: fixed;
      line-height:1.55;
    }

    /* ===== Header（統一） ===== */
    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .header-inner{
      max-width: var(--container);
      margin: 0 auto;
      padding: 14px var(--pad);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .nav{
      width: min(760px, 100%);
      display:flex;
      align-items:center;
      justify-content: space-around;
      gap: 10px;
      flex-wrap:wrap;
    }

    .nav a{
      text-decoration:none;
      color:#344054;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      transition: background-color .15s ease, color .15s ease, transform .05s ease;
      outline: none;
      white-space: nowrap;
    }
    .nav a:hover{ background:#f2f4f7; color:#111827; }
    .nav a:active{ transform: translateY(1px); }
    .nav a:focus-visible{ box-shadow: var(--focus); }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight:700;
      border: 1px solid rgba(37,99,235,.20);
    }

    /* ===== Layout ===== */
    main{
      max-width: var(--content);
      margin: 26px auto 0;
      padding: 0 16px 90px;
    }

    .page-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      margin: 8px 0 14px;
    }
    .page-title h1{
      margin: 0;
      font-size: 18px;
      letter-spacing: .02em;
    }
    .page-title .hint{
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .auth-wrap{
      display:flex;
      justify-content:center;
    }

    .card{
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .section-title{
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .03em;
      margin: 0 0 12px;
    }

    .form-group{
      margin-bottom: 14px;
    }

    label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .input{
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      font-size: 14px;
    }
    select.input{ padding-right: 34px; }
    .input::placeholder{ color:#98a2b3; }
    .input:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .note{
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* 入力エラー */
    .danger{
      border-color: rgba(180,35,24,.65) !important;
      box-shadow: 0 0 0 4px rgba(180,35,24,.10) !important;
      outline: none;
    }
    .field-error{
      color: var(--danger);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.45;
      display:none;
      white-space: pre-wrap;
    }

    /* password row */
    .password-row{
      display:flex;
      gap: 10px;
      align-items:center;
    }
    .password-row .input{ flex:1; }

    .toggle-password{
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      cursor: pointer;
      font-size: 12.5px;
      color:#111827;
      transition: background-color .15s ease, transform .05s ease;
      outline: none;
      white-space: nowrap;
    }
    .toggle-password:hover{ background:#f9fafb; }
    .toggle-password:active{ transform: translateY(1px); }
    .toggle-password:focus-visible{ box-shadow: var(--focus); }

    /* message box */
    .msg{
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #344054;
      font-size: 13px;
      display:none;
      white-space: pre-wrap;
    }
    .msg.error{
      border-color: rgba(180,35,24,.25);
      background: rgba(180,35,24,.06);
      color: var(--danger);
    }
    .msg.success{
      border-color: rgba(15,81,50,.22);
      background: var(--success-bg);
      color: var(--success);
    }

    .btn-area{
      margin-top: 16px;
      display:flex;
      justify-content:center;
    }

    .btn{
      height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
      transition: transform .05s ease, background-color .15s ease, border-color .15s ease;
      outline: none;
      white-space: nowrap;
      min-width: 160px;
    }
    .btn:hover{ background:#f9fafb; }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{ box-shadow: var(--focus); }

    .btn-primary{
      background: var(--accent);
      border-color: rgba(37,99,235,.25);
      color: #fff;
      font-weight: 800;
    }
    .btn-primary:hover{ background: var(--accent-2); }

    .btn:disabled{
      background: #eef2f6;
      border-color: var(--line);
      color: var(--disabled);
      cursor: not-allowed;
      opacity: 1;
    }

    .link-row{
      margin-top: 14px;
      text-align:center;
      font-size: 13px;
      color: var(--muted);
    }
    .link-row a{
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(37,99,235,.35);
    }
    .link-row a:hover{ border-bottom-color: rgba(37,99,235,.85); }

    /* ===== Responsive ===== */
    @media (max-width: 900px){
      :root{ --pad: 16px; }
      .nav{ width: 100%; justify-content:center; }
    }
    @media (max-width: 520px){
      .card{ padding: 16px; }
      .password-row{ flex-direction:column; align-items:stretch; }
      .toggle-password{ width: 100%; }
      .btn{ width: 100%; min-width: 0; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <nav class="nav">
        <a href="index.html">説明会一覧</a>
        <a href="reservations.html">予約確認</a>
        <a id="loginLink" href="login.html">ログイン</a>
        <a class="is-active" href="register.html">新規登録</a>
        <a href="mypage.html">アカウント</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>学生用アカウント新規登録</h1>
      <p class="hint">必要事項を入力して、アカウントを作成します。</p>
    </div>

    <div class="auth-wrap">
      <div class="card">
        <div class="section-title">登録情報</div>

        <div id="message" class="msg"></div>

        <div class="form-group">
          <label for="name">氏名</label>
          <input id="name" class="input" type="text" autocomplete="name" placeholder="例）山田 太郎">
          <div class="field-error" id="nameErr"></div>
        </div>

        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input id="email" class="input" type="email" autocomplete="email" placeholder="例）taro@example.com">
          <div class="field-error" id="emailErr"></div>
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <div class="password-row">
            <input id="password" class="input" type="password" autocomplete="new-password" placeholder="英数字8文字以上">
            <button type="button" id="togglePw" class="toggle-password">表示</button>
          </div>
          <div class="note">※ 英数字8文字以上（例：abc12345）</div>
          <div class="field-error" id="passwordErr"></div>
        </div>

        <div class="form-group">
          <label for="grade">学年</label>
          <select id="grade" class="input">
            <option value="">選択してください</option>
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
            <option value="4">4年</option>
          </select>
          <div class="field-error" id="gradeErr"></div>
        </div>

        <div class="form-group">
          <label for="myClass">クラス</label>
          <select id="myClass" class="input">
            <option value="">選択してください</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
          <div class="field-error" id="classErr"></div>
        </div>

        <div class="form-group">
          <label for="number">出席番号</label>
          <input id="number" class="input" type="number" min="1" placeholder="例）12">
          <div class="field-error" id="numberErr"></div>
        </div>

        <div class="btn-area">
          <button id="registerBtn" class="btn btn-primary" disabled>登録する</button>
        </div>

        <div class="link-row">
          すでにアカウントをお持ちですか？ <a href="login.html">ログインはこちら</a>
        </div>
      </div>
    </div>
  </main>

<script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080";
  // const API_BASE = "";

  const el = (id) => document.getElementById(id);

  function showMessage(text, isError) {
    const msg = el("message");
    if (!text) {
      msg.textContent = "";
      msg.className = "msg";
      msg.style.display = "none";
      return;
    }
    msg.textContent = text;
    msg.className = "msg " + (isError ? "error" : "success");
    msg.style.display = "block";
  }

  function setFieldError(inputEl, errEl, message) {
    if (!inputEl || !errEl) return;
    if (message) {
      inputEl.classList.add("danger");
      errEl.textContent = message;
      errEl.style.display = "block";
    } else {
      inputEl.classList.remove("danger");
      errEl.textContent = "";
      errEl.style.display = "none";
    }
  }

  // ★必須 & 形式チェック
  function validate({ show = true } = {}) {
    if (show) showMessage("", false);

    const name = el("name").value.trim();
    const email = el("email").value.trim();
    const password = el("password").value;
    const grade = el("grade").value;
    const myClass = el("myClass").value;
    const numberRaw = el("number").value;

    let ok = true;

    if (!name) {
      ok = false;
      if (show) setFieldError(el("name"), el("nameErr"), "氏名を入力してください。");
    } else {
      if (show) setFieldError(el("name"), el("nameErr"), "");
    }

    if (!email) {
      ok = false;
      if (show) setFieldError(el("email"), el("emailErr"), "メールアドレスを入力してください。");
    } else if (!email.includes("@")) {
      ok = false;
      if (show) setFieldError(el("email"), el("emailErr"), "メールアドレスは「@」を含めてください。");
    } else {
      if (show) setFieldError(el("email"), el("emailErr"), "");
    }

    const passRule = /^[A-Za-z0-9]{8,}$/;
    if (!password) {
      ok = false;
      if (show) setFieldError(el("password"), el("passwordErr"), "パスワードを入力してください。");
    } else if (!passRule.test(password)) {
      ok = false;
      if (show) setFieldError(el("password"), el("passwordErr"), "英数字のみで8文字以上にしてください（記号・全角は不可）。");
    } else {
      if (show) setFieldError(el("password"), el("passwordErr"), "");
    }

    if (!grade) {
      ok = false;
      if (show) setFieldError(el("grade"), el("gradeErr"), "学年を選択してください。");
    } else {
      if (show) setFieldError(el("grade"), el("gradeErr"), "");
    }

    if (!myClass) {
      ok = false;
      if (show) setFieldError(el("myClass"), el("classErr"), "クラス（A〜E）を選択してください。");
    } else {
      if (show) setFieldError(el("myClass"), el("classErr"), "");
    }

    const number = parseInt(numberRaw, 10);
    if (!numberRaw) {
      ok = false;
      if (show) setFieldError(el("number"), el("numberErr"), "出席番号を入力してください。");
    } else if (Number.isNaN(number) || number < 1) {
      ok = false;
      if (show) setFieldError(el("number"), el("numberErr"), "出席番号は1以上の数字にしてください。");
    } else {
      if (show) setFieldError(el("number"), el("numberErr"), "");
    }

    el("registerBtn").disabled = !ok;
    return { ok, values: { name, email, password, grade, myClass, number } };
  }

  async function registerStudent() {
    const v = validate({ show: true });
    if (!v.ok) {
      showMessage("入力内容を確認してください。", true);
      return;
    }

    const { name, email, password, grade, myClass, number } = v.values;

    const payload = {
      name,
      email,
      password,
      grade: parseInt(grade, 10),
      myClass,
      number
    };

    try {
      el("registerBtn").disabled = true;

      const res = await fetch(`${API_BASE}/auth/register/student`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let text = "登録に失敗しました。メールアドレス重複などを確認してください。";
        try {
          const body = await res.text();
          if (body) text = body;
        } catch (_) {}
        showMessage(text, true);
        validate({ show: false });
        return;
      }

      showMessage("登録が完了しました。ログイン画面へ移動します。", false);

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1200);

    } catch (err) {
      console.error(err);
      showMessage("サーバーへの接続に失敗しました。バックエンドを確認してください。", true);
      validate({ show: false });
    }
  }

  // パスワード表示切替
  el("togglePw").addEventListener("click", () => {
    const pw = el("password");
    const isHidden = pw.type === "password";
    pw.type = isHidden ? "text" : "password";
    el("togglePw").textContent = isHidden ? "非表示" : "表示";
  });

  // リアルタイムチェック
  ["name","email","password","grade","myClass","number"].forEach(id => {
    el(id).addEventListener("input", () => validate({ show: true }));
    el(id).addEventListener("change", () => validate({ show: true }));
  });

  window.addEventListener("load", () => validate({ show: false }));
  el("registerBtn").addEventListener("click", registerStudent);
</script>
</body>
</html>
