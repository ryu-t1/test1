<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>学生用新規登録</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }

    /* 上部メニュー（一覧ページと揃えるイメージ） */
    header {
      border-bottom: 1px solid #ccc;
      padding: 16px 40px;
      display: flex;
      justify-content: center;
      gap: 80px;
      font-size: 14px;
      background-color: #fff;
    }

    header a {
      text-decoration: none;
      color: #333;
      cursor: pointer;
    }

    main {
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px 40px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 24px;
    }

    .form-card {
      background-color: #fff;
      border: 1px solid #333;
      padding: 24px 24px 20px;
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
      font-size: 14px;
      border: 1px solid #ccc;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .error {
      color: #c00;
      font-size: 13px;
      margin-top: 4px;
    }

    .success {
      color: #080;
      font-size: 13px;
      margin-top: 4px;
    }

    .btn-area {
      text-align: center;
      margin-top: 18px;
    }

    button {
      padding: 8px 18px;
      cursor: pointer;
      font-size: 14px;
      border: 1px solid #333;
      background: #fff;
    }
    button:disabled{
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ★追加：入力エラーの見た目 */
    .danger {
      border-color: #c00 !important;
      outline: none;
    }
    .field-error{
      color:#c00;
      font-size:12px;
      margin-top:6px;
      line-height:1.4;
    }
  </style>
</head>
<body>

<header>
  <!-- href は実際のファイル名に合わせて変えてください -->
  <a href="index.html">説明会一覧</a>
  <a href="reservations.html">予約確認</a>
  <a href="login.html">ログイン</a>
  <a href="register.html">新規登録</a>
  <a href="mypage.html">アカウント</a>
</header>

<main>
  <h1>学生用アカウント新規登録</h1>

  <div class="form-card">
    <div id="message"></div>

    <div class="form-group">
      <label for="name">氏名</label>
      <input id="name" type="text" autocomplete="name">
      <div class="field-error" id="nameErr" style="display:none;"></div>
    </div>

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email">
      <div class="field-error" id="emailErr" style="display:none;"></div>
    </div>

    <div class="form-group">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="new-password">
      <div class="note">※ 英数字8文字以上（例：abc12345）</div>
      <div class="field-error" id="passwordErr" style="display:none;"></div>
    </div>

    <div class="form-group">
      <label for="grade">学年</label>
      <select id="grade">
        <option value="">選択してください</option>
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
        <option value="4">4年</option>
      </select>
      <div class="field-error" id="gradeErr" style="display:none;"></div>
    </div>

    <div class="form-group">
      <label for="myClass">クラス</label>
      <!-- ★ input → select（A〜E） -->
      <select id="myClass">
        <option value="">選択してください</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
      </select>
      <div class="field-error" id="classErr" style="display:none;"></div>
    </div>

    <div class="form-group">
      <label for="number">出席番号</label>
      <input id="number" type="number" min="1">
      <div class="field-error" id="numberErr" style="display:none;"></div>
    </div>

    <div class="btn-area">
      <button id="registerBtn">登録する</button>
    </div>
  </div>
</main>

<script>
  const API_BASE = "http://localhost:8080"; // バックエンドURL
  // const API_BASE = "http://45.76.55.162:8080"; //外部公開用のURL

  const el = (id) => document.getElementById(id);

  function showMessage(text, isError) {
    const msg = el("message");
    msg.textContent = text;
    msg.className = isError ? "error" : "success";
  }

  function setFieldError(inputEl, errEl, message) {
    if (!inputEl || !errEl) return;
    if (message) {
      inputEl.classList.add("danger");
      errEl.textContent = message;
      errEl.style.display = "block";
    } else {
      inputEl.classList.remove("danger");
      errEl.textContent = "";
      errEl.style.display = "none";
    }
  }

  // ★必須 & 形式チェック（リアルタイムでも登録時でも使う）
  function validate({ show = true } = {}) {
    // 全体メッセージは入力中は消す（登録時にだけ出したい場合はここ消してOK）
    if (show) showMessage("", false);

    const name = el("name").value.trim();
    const email = el("email").value.trim();
    const password = el("password").value;
    const grade = el("grade").value;
    const myClass = el("myClass").value;
    const numberRaw = el("number").value;

    let ok = true;

    // 氏名
    if (!name) {
      ok = false;
      if (show) setFieldError(el("name"), el("nameErr"), "氏名を入力してください。");
    } else {
      if (show) setFieldError(el("name"), el("nameErr"), "");
    }

    // メール：@必須（最低限）
    if (!email) {
      ok = false;
      if (show) setFieldError(el("email"), el("emailErr"), "メールアドレスを入力してください。");
    } else if (!email.includes("@")) {
      ok = false;
      if (show) setFieldError(el("email"), el("emailErr"), "メールアドレスは「@」を含めてください。");
    } else {
      if (show) setFieldError(el("email"), el("emailErr"), "");
    }

    // パスワード：英数字8文字以上
    const passRule = /^[A-Za-z0-9]{8,}$/;
    if (!password) {
      ok = false;
      if (show) setFieldError(el("password"), el("passwordErr"), "パスワードを入力してください。");
    } else if (!passRule.test(password)) {
      ok = false;
      if (show) setFieldError(el("password"), el("passwordErr"), "英数字のみで8文字以上にしてください（記号・全角は不可）。");
    } else {
      if (show) setFieldError(el("password"), el("passwordErr"), "");
    }

    // 学年
    if (!grade) {
      ok = false;
      if (show) setFieldError(el("grade"), el("gradeErr"), "学年を選択してください。");
    } else {
      if (show) setFieldError(el("grade"), el("gradeErr"), "");
    }

    // クラス：A〜Eの選択必須
    if (!myClass) {
      ok = false;
      if (show) setFieldError(el("myClass"), el("classErr"), "クラス（A〜E）を選択してください。");
    } else {
      if (show) setFieldError(el("myClass"), el("classErr"), "");
    }

    // 出席番号：1以上の整数
    const number = parseInt(numberRaw, 10);
    if (!numberRaw) {
      ok = false;
      if (show) setFieldError(el("number"), el("numberErr"), "出席番号を入力してください。");
    } else if (Number.isNaN(number) || number < 1) {
      ok = false;
      if (show) setFieldError(el("number"), el("numberErr"), "出席番号は1以上の数字にしてください。");
    } else {
      if (show) setFieldError(el("number"), el("numberErr"), "");
    }

    // 登録ボタンの制御
    el("registerBtn").disabled = !ok;

    return { ok, values: { name, email, password, grade, myClass, number } };
  }

  async function registerStudent() {
    // 登録時は必ず表示ありでチェック
    const v = validate({ show: true });
    if (!v.ok) {
      showMessage("入力内容を確認してください。", true);
      return;
    }

    const { name, email, password, grade, myClass, number } = v.values;

    const payload = {
      name,
      email,
      password,
      grade: parseInt(grade, 10),
      myClass,
      number
    };

    try {
      el("registerBtn").disabled = true;

      const res = await fetch(`${API_BASE}/auth/register/student`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let text = "登録に失敗しました。メールアドレス重複などを確認してください。";
        try {
          const body = await res.text();
          if (body) text = body;
        } catch (_) {}
        showMessage(text, true);
        el("registerBtn").disabled = false;
        return;
      }

      showMessage("登録が完了しました。トップページへ移動します。", false);

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1200);

    } catch (err) {
      console.error(err);
      showMessage("サーバーへの接続に失敗しました。バックエンドを確認してください。", true);
      el("registerBtn").disabled = false;
    }
  }

  // リアルタイムでチェック（入力のたびに赤枠/エラー/ボタン制御）
  ["name","email","password","grade","myClass","number"].forEach(id => {
    el(id).addEventListener("input", () => validate({ show: true }));
    el(id).addEventListener("change", () => validate({ show: true }));
  });

  // 初期状態：ボタンは無効でOK
  window.addEventListener("load", () => validate({ show: false }));

  el("registerBtn").addEventListener("click", registerStudent);
</script>

</body>
</html>
