<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>教師用新規登録（super_admin）</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }

    /* ===== 上部メニュー（super_admin用） ===== */
    header {
      border-bottom: 1px solid #ccc;
      padding: 16px 40px;
      display: flex;
      justify-content: center;
      gap: 80px;
      font-size: 14px;
      background-color: #fff;
    }

    header a {
      text-decoration: none;
      color: #333;
      cursor: pointer;
    }

    main {
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px 40px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 24px;
    }

    .form-card {
      background-color: #fff;
      border: 1px solid #333;
      padding: 24px 24px 20px;
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .error {
      color: #c00;
      font-size: 13px;
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .success {
      color: #080;
      font-size: 13px;
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .btn-area {
      text-align: center;
      margin-top: 18px;
    }

    button {
      padding: 8px 18px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<!-- ===== super_admin用ヘッダー（管理画面と統一） ===== -->
<header>
  <a href="adminevents.html">説明会情報管理</a>
  <a href="admincompanies.html">会社情報管理</a>
   <a href="super_admin_user_manage.html">ユーザー管理</a>
  <a href="teacherRegister.html">新規教師登録</a>
  <a href="#" id="logoutLink">ログアウト</a>
  <a href="super_admin_mypage.html">アカウント</a>
</header>

<main>
  <h1>教師用アカウント新規登録</h1>

  <div class="form-card">
    <div id="message"></div>

    <div class="form-group">
      <label for="name">氏名</label>
      <input id="name" type="text" autocomplete="name">
    </div>

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="new-password">
      <div class="note"></div>
    </div>

    <div class="form-group">
      <label for="grade">担当学年</label>
      <select id="grade">
        <option value="">選択してください</option>
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
        <option value="4">4年</option>
      </select>
    </div>

    <div class="form-group">
      <label for="myClass">クラス</label>
      <input id="myClass" type="text" placeholder="例）A, B など">
    </div>

    <div class="btn-area">
      <button id="registerBtn">登録する</button>
    </div>
  </div>
</main>

<script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080"; // 外部公開用

  const token = localStorage.getItem("token");
  const role = (localStorage.getItem("role") || "").toUpperCase();
  const isSuperAdmin = (role === "SUPER_ADMIN");

  const msgEl = document.getElementById("message");
  const registerBtn = document.getElementById("registerBtn");

  function showMessage(text, isError) {
    msgEl.textContent = text;
    msgEl.className = isError ? "error" : "success";
  }

  // ===== ログアウト（管理画面と同じ） =====
  document.getElementById("logoutLink").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("email");
    localStorage.removeItem("name");
    localStorage.removeItem("role");
    alert("ログアウトしました。");
    window.location.href = "login.html";
  });

  // ===== super_adminチェック（表示は残し、操作だけ止める） =====
  if (!token) {
    showMessage("JWTトークンがありません。先にsuper_adminでログインしてください。", true);
    registerBtn.disabled = true;
  } else if (!isSuperAdmin) {
    showMessage("権限がありません。super_adminでログインしてください。", true);
    registerBtn.disabled = true;
  }

  async function readError(res) {
    const raw = await res.text();
    if (!raw) return "";
    try {
      const obj = JSON.parse(raw);
      return obj.message ?? JSON.stringify(obj);
    } catch {
      return raw;
    }
  }

  async function registerTeacher() {
    if (!token || !isSuperAdmin) return;

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const grade = document.getElementById("grade").value;
    const myClass = document.getElementById("myClass").value.trim();

    if (!name || !email || !password || !grade || !myClass) {
      showMessage("未入力の項目があります。", true);
      return;
    }

    const payload = {
      name,
      email,
      password,
      grade: parseInt(grade, 10),
      myClass
    };

    registerBtn.disabled = true;
    showMessage("", false);

    try {
      const res = await fetch(`${API_BASE}/auth/register/teacher`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}` // ★ super_adminでの登録を想定
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errMsg = await readError(res);
        showMessage(`登録に失敗しました。\n${errMsg || "メール重複などを確認してください。"}`, true);
        registerBtn.disabled = false;
        return;
      }

      // ===== 成功：遷移しないで、この画面に残る =====
      showMessage("教師アカウントの登録が完了しました。", false);

      // 入力欄クリア（連続登録しやすい）
      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
      document.getElementById("grade").value = "";
      document.getElementById("myClass").value = "";

      registerBtn.disabled = false;

    } catch (err) {
      console.error(err);
      showMessage("サーバーへの接続に失敗しました。バックエンドを確認してください。", true);
      registerBtn.disabled = false;
    }
  }

  registerBtn.addEventListener("click", registerTeacher);
</script>

</body>
</html>
