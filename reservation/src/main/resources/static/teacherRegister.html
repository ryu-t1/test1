<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教師用新規登録（super_admin）</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --line-strong:#d0d5dd;
      --shadow-sm: 0 6px 16px rgba(16,24,40,.06);
      --accent:#2563eb;
      --accent-2:#1d4ed8;
      --danger:#b42318;
      --focus: 0 0 0 4px rgba(37,99,235,.18);
      --container: 1120px;
      --pad: 24px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      padding-bottom:72px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== Header ===== */
    header{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .header-inner{
      max-width: var(--container);
      margin:0 auto;
      padding:14px var(--pad);
      display:flex;
      justify-content:center;
    }
    .nav{
      width:min(760px,100%);
      display:flex;
      justify-content:space-around;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav a{
      text-decoration:none;
      color:#344054;
      font-size:13px;
      padding:8px 12px;
      border-radius:999px;
      white-space:nowrap;
    }
    .nav a.is-active{
      background: rgba(37,99,235,.10);
      color:#1d4ed8;
      font-weight:800;
    }
    .nav a.danger-link{
      color:#b42318;
      background: rgba(180,35,24,.06);
    }

    /* ===== Layout ===== */
    main{
      max-width:560px;
      margin:28px auto 0;
      padding:0 16px 40px;
    }
    h1{
      text-align:center;
      font-size:18px;
      margin:12px 0;
    }

    .form-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow: var(--shadow-sm);
      padding:18px 16px 16px;
    }

    .message{
      font-size:13px;
      margin-bottom:12px;
      white-space:pre-wrap;
    }
    .message.error{ color:var(--danger); }
    .message.success{ color:#0a7a2f; }

    .field{ margin:10px 0; }
    .field label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .field input, .field select{
      width:100%;
      height:42px;
      padding:0 12px;
      border:1px solid var(--line-strong);
      border-radius:12px;
      font-size:14px;
      outline:none;
    }
    .field input:focus, .field select:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: var(--focus);
    }

    .note{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /* ===== password toggle ===== */
    .pw-wrap{
      position:relative;
    }
    .pw-wrap input{
      padding-right:64px;
    }
    .pw-toggle{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      height:28px;
      padding:0 10px;
      border-radius:10px;
      border:1px solid var(--line-strong);
      background:#fff;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }

    /* ★見た目を●にする（type=text運用時に使う） */
    #password.masked{
      -webkit-text-security: disc; /* Safari/Chrome系 */
      text-security: disc;         /* 将来用 */
    }

    /* ===== error ===== */
    .danger{
      border-color: rgba(180,35,24,.65)!important;
      box-shadow: 0 0 0 4px rgba(180,35,24,.10)!important;
    }
    .field-error{
      color:var(--danger);
      font-size:12px;
      margin-top:6px;
      display:none;
      white-space:pre-wrap;
    }

    .actions{
      display:flex;
      justify-content:flex-end;
      margin-top:14px;
    }
    .btn{
      height:42px;
      padding:0 16px;
      border-radius:12px;
      border:1px solid var(--line-strong);
      background:#fff;
      cursor:pointer;
      font-size:13px;
    }
    .btn-primary{
      background:var(--accent);
      color:#fff;
      font-weight:800;
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <nav class="nav">
      <a href="adminevents.html">説明会情報管理</a>
      <a href="admincompanies.html">会社情報管理</a>
      <a href="super_admin_user_manage.html">ユーザー管理</a>
      <a class="is-active" href="teacherRegister.html">新規教師登録</a>
      <a href="super_admin_mypage.html">アカウント</a>
      <a href="#" id="logoutLink" class="danger-link">ログアウト</a>
    </nav>
  </div>
</header>

<main>
  <h1>教師用アカウント新規登録</h1>

  <div class="form-card">
    <div id="message" class="message"></div>

    <div class="field">
      <label>氏名</label>
      <input id="name">
      <div id="nameErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>メールアドレス</label>
      <input id="email" type="email">
      <div id="emailErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>パスワード</label>
      <div class="pw-wrap">
        <input id="password" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pwToggle">表示</button>
      </div>
      <div class="note">英数字8文字以上（記号・全角は不可）</div>
      <div id="passwordErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>担当学年</label>
      <select id="grade">
        <option value="">選択してください</option>
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
        <option value="4">4年</option>
      </select>
      <div id="gradeErr" class="field-error"></div>
    </div>

    <div class="field">
      <label>クラス</label>
      <select id="myClass">
        <option value="">選択してください</option>
        <option>A</option><option>B</option><option>C</option>
        <option>D</option><option>E</option>
      </select>
      <div id="classErr" class="field-error"></div>
    </div>

    <div class="actions">
      <button id="registerBtn" class="btn btn-primary">登録する</button>
    </div>
  </div>
</main>

<script>
  const API_BASE = "http://localhost:8080";
  // const API_BASE = "http://45.76.55.162:8080";

  const token = localStorage.getItem("token");
  const role = (localStorage.getItem("role") || "").toUpperCase();
  const isSuperAdmin = (role === "SUPER_ADMIN");

  const msgEl = document.getElementById("message");
  const registerBtn = document.getElementById("registerBtn");

  function showMessage(text, err){
    msgEl.textContent = text || "";
    msgEl.className = "message " + (err ? "error" : "success");
  }

  // ===== ログアウト（最新版の挙動：indexへ） =====
  document.getElementById("logoutLink").onclick = e => {
    e.preventDefault();
    ["token","userId","email","name","role"].forEach(k=>localStorage.removeItem(k));
    window.location.href="index.html";
  };

  // ===== super_adminチェック =====
  if(!token || !isSuperAdmin){
    showMessage("super_adminでログインしてください。", true);
    registerBtn.disabled = true;
  }

  /* =========================================================
     パスワード：入力中にブラウザの👁を出さない（最新版の処理を維持）
  ========================================================= */
  const pwInput = document.getElementById("password");
  const pwToggle = document.getElementById("pwToggle");
  let reveal = false;

  function applyPwMode() {
    if (!pwToggle) return; // 旧UIなどでトグルが無い場合にも耐える

    if (reveal) {
      pwInput.type = "text";
      pwInput.classList.remove("masked");
      pwToggle.textContent = "非表示";
    } else {
      const focused = (document.activeElement === pwInput);
      if (focused) {
        pwInput.type = "text";
        pwInput.classList.add("masked");
      } else {
        pwInput.classList.remove("masked");
        pwInput.type = "password";
      }
      pwToggle.textContent = "表示";
    }
  }

  if (pwToggle) {
    applyPwMode();
    pwInput.addEventListener("focus", () => applyPwMode());
    pwInput.addEventListener("blur",  () => applyPwMode());
    pwToggle.addEventListener("click", () => {
      reveal = !reveal;
      applyPwMode();
      pwInput.focus();
    });
  }

  // ===== 表示ヘルパー =====
  function show(el){ el.style.display = "block"; }
  function hide(el){ el.style.display = "none"; }

  // ===== 「触った後だけ」赤文字 =====
  const touched = { name:false, email:false, password:false, grade:false, myClass:false };

  function setFieldError(inputEl, errEl, message, shouldShow){
    if(!inputEl || !errEl) return;

    if(!shouldShow){
      inputEl.classList.remove("danger");
      errEl.textContent = "";
      hide(errEl);
      return;
    }

    if(message){
      inputEl.classList.add("danger");
      errEl.textContent = message;
      show(errEl);
    }else{
      inputEl.classList.remove("danger");
      errEl.textContent = "";
      hide(errEl);
    }
  }

  const PASS_RULE = /^[A-Za-z0-9]{8,}$/;

  function validateOne(fieldKey, showIfTouchedOnly, forceShowAll){
    const nameEl  = document.getElementById("name");
    const emailEl = document.getElementById("email");
    const pwEl    = document.getElementById("password");
    const gradeEl = document.getElementById("grade");
    const classEl = document.getElementById("myClass");

    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    const password = pwEl.value;
    const grade = gradeEl.value;
    const myClass = classEl.value;

    const canShow = forceShowAll ? true : (showIfTouchedOnly ? !!touched[fieldKey] : true);

    if(fieldKey === "name"){
      const msg = !name ? "氏名を入力してください。" : "";
      setFieldError(nameEl, document.getElementById("nameErr"), msg, canShow);
      return !msg;
    }

    if(fieldKey === "email"){
      let msg = "";
      if(!email) msg = "メールアドレスを入力してください。";
      else if(!email.includes("@")) msg = "メールアドレスは「@」を含めてください。";
      setFieldError(emailEl, document.getElementById("emailErr"), msg, canShow);
      return !msg;
    }

    if(fieldKey === "password"){
      let msg = "";
      if(!password) msg = "パスワードを入力してください。";
      else if(!PASS_RULE.test(password)) msg = "パスワードは英数字8文字以上にしてください。";
      setFieldError(pwEl, document.getElementById("passwordErr"), msg, canShow);
      return !msg;
    }

    if(fieldKey === "grade"){
      const msg = !grade ? "担当学年を選択してください。" : "";
      setFieldError(gradeEl, document.getElementById("gradeErr"), msg, canShow);
      return !msg;
    }

    if(fieldKey === "myClass"){
      const msg = !myClass ? "クラスを選択してください。" : "";
      setFieldError(classEl, document.getElementById("classErr"), msg, canShow);
      return !msg;
    }

    return true;
  }

  function validateAll({ showTouchedOnly = true, forceShowAll = false } = {}){
    const ok =
      validateOne("name", showTouchedOnly, forceShowAll) &&
      validateOne("email", showTouchedOnly, forceShowAll) &&
      validateOne("password", showTouchedOnly, forceShowAll) &&
      validateOne("grade", showTouchedOnly, forceShowAll) &&
      validateOne("myClass", showTouchedOnly, forceShowAll);

    const authOk = !!token && isSuperAdmin;
    registerBtn.disabled = !(ok && authOk);
    return ok && authOk;
  }

  function attachTouchedValidation(id, key){
    const el = document.getElementById(id);
    if(!el) return;

    el.addEventListener("input", () => {
      validateAll({ showTouchedOnly: true, forceShowAll: false });
    });

    const mark = () => {
      touched[key] = true;
      validateAll({ showTouchedOnly: true, forceShowAll: false });
    };
    el.addEventListener("blur", mark);
    el.addEventListener("change", mark);
  }

  attachTouchedValidation("name","name");
  attachTouchedValidation("email","email");
  attachTouchedValidation("password","password");
  attachTouchedValidation("grade","grade");
  attachTouchedValidation("myClass","myClass");

  async function readError(res){
    const raw = await res.text().catch(()=> "");
    if(!raw) return "";
    try{
      const obj = JSON.parse(raw);
      return obj.message ?? JSON.stringify(obj);
    }catch{
      return raw;
    }
  }

  async function registerTeacher(){
    if(!token || !isSuperAdmin) return;

    // 送信時は全項目エラー強制表示
    const ok = validateAll({ showTouchedOnly: false, forceShowAll: true });
    if(!ok){
      showMessage("入力内容を確認してください。", true);
      return;
    }

    const payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      grade: parseInt(document.getElementById("grade").value, 10),
      myClass: document.getElementById("myClass").value
    };

    registerBtn.disabled = true;
    showMessage("", false);

    try{
      const res = await fetch(`${API_BASE}/auth/register/teacher`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if(!res.ok){
        const errMsg = await readError(res);
        showMessage(`登録に失敗しました。\n${errMsg || "メール重複などを確認してください。"}`, true);
        validateAll({ showTouchedOnly:true, forceShowAll:false });
        return;
      }

      showMessage("教師アカウントの登録が完了しました。", false);

      // 入力欄クリア
      ["name","email","password","grade","myClass"].forEach(id => {
        const el = document.getElementById(id);
        el.value = "";
        el.classList.remove("danger");
      });

      // touched / エラー表示を初期化
      Object.keys(touched).forEach(k => touched[k] = false);
      ["nameErr","emailErr","passwordErr","gradeErr","classErr"].forEach(id => {
        const el = document.getElementById(id);
        if(el){ el.textContent=""; hide(el); }
      });

      // パスワード表示状態も初期に
      if (pwToggle) {
        reveal = false;
        applyPwMode();
      }

      validateAll({ showTouchedOnly:true, forceShowAll:false });

    }catch(e){
      console.error(e);
      showMessage("サーバーへの接続に失敗しました。バックエンドを確認してください。", true);
      validateAll({ showTouchedOnly:true, forceShowAll:false });
    }
  }

  // ★これが最新版で消えてた本体
  registerBtn.addEventListener("click", registerTeacher);

  // 初期状態：赤文字は出さずに、ボタンだけ状態更新
  validateAll({ showTouchedOnly:true, forceShowAll:false });
</script>

</body>
</html>
